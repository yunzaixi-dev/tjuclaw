[project]
name = "tjuclaw-ocr"
version = "0.0.1"
description = "Local PaddleOCR-VL 1.6 worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "paddlepaddle-gpu==3.3.0",
  "paddleocr[doc-parser]>=3.6.0",
  "safetensors>=0.6.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }
