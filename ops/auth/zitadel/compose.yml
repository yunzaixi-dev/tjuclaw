# Isolated, disposable authentication regression stack. Never production.
name: tjuclaw-auth-test

x-zitadel: &zitadel
  image: ghcr.io/zitadel/zitadel:v4.17.3
  user: "${AUTH_TEST_UID:-1000}:${AUTH_TEST_GID:-1000}"
  environment:
    ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?}
    ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
    ZITADEL_DATABASE_POSTGRES_PORT: 5432
    ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
    ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
    ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DATABASE_PASSWORD:?}
    ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
    ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
    ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DATABASE_PASSWORD:?}
    ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
    ZITADEL_PORT: 8080
    ZITADEL_EXTERNALPORT: 14435
    ZITADEL_EXTERNALDOMAIN: localhost
    ZITADEL_EXTERNALSECURE: "false"
    ZITADEL_TLS_ENABLED: "false"
    ZITADEL_DEFAULTINSTANCE_DOMAINPOLICY_SMTPSENDERADDRESSMATCHESINSTANCEDOMAIN: "false"
    ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: mail:1025
    ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "false"
    ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: test@localhost
    ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: TJUClaw
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_EMAILVERIFICATIONCODE_LENGTH: 6
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_EMAILVERIFICATIONCODE_EXPIRY: 10m
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_EMAILVERIFICATIONCODE_INCLUDELOWERLETTERS: "false"
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_EMAILVERIFICATIONCODE_INCLUDEUPPERLETTERS: "false"
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_EMAILVERIFICATIONCODE_INCLUDEDIGITS: "true"
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_EMAILVERIFICATIONCODE_INCLUDESYMBOLS: "false"
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_OTPEMAIL_LENGTH: 6
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_OTPEMAIL_EXPIRY: 10m
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_OTPEMAIL_INCLUDELOWERLETTERS: "false"
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_OTPEMAIL_INCLUDEUPPERLETTERS: "false"
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_OTPEMAIL_INCLUDEDIGITS: "true"
    ZITADEL_DEFAULTINSTANCE_SECRETGENERATORS_OTPEMAIL_INCLUDESYMBOLS: "false"
    ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/owner.pat
    ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /bootstrap/login-client.pat
    ZITADEL_FIRSTINSTANCE_ORG_NAME: TJUClaw Test
    ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: zitadel-owner
    ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Bootstrap Owner
    ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
    ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
    ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login Client
    ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
  volumes:
    - ${ZITADEL_BOOTSTRAP_DIR:?}:/bootstrap

services:
  zitadel-db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ZITADEL_DATABASE_PASSWORD:?}
      POSTGRES_DB: postgres
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 3s
      retries: 30
  zitadel-init:
    <<: *zitadel
    command: init
    depends_on:
      zitadel-db:
        condition: service_healthy
  zitadel-setup:
    <<: *zitadel
    command: setup --masterkeyFromEnv
    depends_on:
      zitadel-init:
        condition: service_completed_successfully
  zitadel:
    <<: *zitadel
    command: start --masterkeyFromEnv --tlsMode disabled
    ports:
      - "127.0.0.1:14435:8080"
    depends_on:
      zitadel-setup:
        condition: service_completed_successfully
      mail:
        condition: service_started
  mail:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:18026:8025"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  valkey:
    image: valkey/valkey:9-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    user: "999:999"
    command: [valkey-server, --appendonly, "yes", --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes:
      - cap-valkey-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 15
  cap:
    image: tiago2/cap:3.1.11@sha256:c29417b6270d1fddc6a0603c08d972f89a12de81889d09c3f97a0915422fba5e
    user: "1000:1000"
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:?}
      REDIS_URL: redis://valkey:6379
      SERVER_PORT: 3000
      SERVER_HOSTNAME: 0.0.0.0
      ENABLE_ASSETS_SERVER: "false"
    ports:
      - "127.0.0.1:13301:3000"
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  zitadel-db-data:
  cap-valkey-data:
