# Only mutations consume the stricter email-attempt budget.
map $request_method $auth_mutation_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=auth_flow:10m rate=60r/m;
limit_req_zone $auth_mutation_key zone=auth_mutation:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /api/kratos/ {
        access_log off;
        client_max_body_size 16k;
        limit_req zone=auth_flow burst=20 nodelay;
        limit_req zone=auth_mutation burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080/kratos/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location /auth/ {
        access_log off;
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
