# Ansible configuration for TJUClaw operations
# Reference: https://docs.ansible.com/ansible/latest/reference_appendices/config.html

[defaults]
inventory = ../local/ansible-inventory.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
nocows = True
stdout_callback = default
bin_ansible_callbacks = True
gathering = explicit

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes
