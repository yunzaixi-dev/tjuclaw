---
# Manage durable random secrets for newapi_stack
# Never rotate existing secrets on remote

- name: Check if .env.db already exists
  ansible.builtin.stat:
    path: "{{ newapi_base_dir }}/.env.db"
  register: newapi_env_db_stat

- name: Check if .env.newapi already exists
  ansible.builtin.stat:
    path: "{{ newapi_base_dir }}/.env.newapi"
  register: newapi_env_newapi_stat

- name: Check if credentials file already exists
  ansible.builtin.stat:
    path: "{{ newapi_base_dir }}/credentials.json"
  register: newapi_credentials_stat

- name: Slurp existing .env.db if present
  ansible.builtin.slurp:
    path: "{{ newapi_base_dir }}/.env.db"
  register: newapi_existing_env_db_slurp
  when: newapi_env_db_stat.stat.exists
  no_log: true

- name: Slurp existing .env.newapi if present
  ansible.builtin.slurp:
    path: "{{ newapi_base_dir }}/.env.newapi"
  register: newapi_existing_env_newapi_slurp
  when: newapi_env_newapi_stat.stat.exists
  no_log: true

- name: Slurp existing credentials.json if present
  ansible.builtin.slurp:
    path: "{{ newapi_base_dir }}/credentials.json"
  register: newapi_existing_credentials_slurp
  when: newapi_credentials_stat.stat.exists
  no_log: true

- name: Extract existing secrets if available
  ansible.builtin.set_fact:
    newapi_existing_db_password: >-
      {{
        newapi_existing_env_db_slurp.content | b64decode |
        regex_findall('(?m)^POSTGRES_PASSWORD=(.+)$') | first | default('') | trim
        if (newapi_env_db_stat.stat.exists and newapi_existing_env_db_slurp.content is defined) else ''
      }}
    newapi_existing_session_secret: >-
      {{
        newapi_existing_env_newapi_slurp.content | b64decode |
        regex_findall('(?m)^SESSION_SECRET=(.+)$') | first | default('') | trim
        if (newapi_env_newapi_stat.stat.exists and newapi_existing_env_newapi_slurp.content is defined) else ''
      }}
    newapi_existing_admin_password: >-
      {{
        (newapi_existing_credentials_slurp.content | b64decode | from_json).admin_password | default('') | trim
        if (newapi_credentials_stat.stat.exists and newapi_existing_credentials_slurp.content is defined) else ''
      }}
  no_log: true

- name: Reject damaged existing secrets instead of silently rotating them
  ansible.builtin.assert:
    that:
      - newapi_env_db_stat.stat.exists == newapi_env_newapi_stat.stat.exists
      - newapi_env_db_stat.stat.exists == newapi_credentials_stat.stat.exists
      - not newapi_env_db_stat.stat.exists or (newapi_existing_db_password | length > 0)
      - not newapi_env_newapi_stat.stat.exists or (newapi_existing_session_secret | length >= 32)
      - not newapi_credentials_stat.stat.exists or (newapi_existing_admin_password | length >= 12)
    fail_msg: Existing NewAPI secret files are incomplete; restore the original files before deploying.
  no_log: true

- name: Reject an unexpected change of administrator username
  ansible.builtin.assert:
    that:
      - (newapi_existing_credentials_slurp.content | b64decode | from_json).admin_username == newapi_admin_username
    fail_msg: Administrator username differs from the existing credentials; restore the original deployment setting.
  when: newapi_credentials_stat.stat.exists
  no_log: true

- name: Generate cryptographically secure random secrets on target if absent
  ansible.builtin.command:
    cmd: python3 -c "import secrets; print(secrets.token_hex(24) + ' ' + secrets.token_hex(32) + ' ' + secrets.token_urlsafe(24))"
  register: newapi_generated_secrets
  changed_when: false
  no_log: true
  when: >-
    (newapi_existing_db_password | length == 0) or
    (newapi_existing_session_secret | length == 0) or
    (newapi_existing_admin_password | length == 0)

- name: Assign final durable secrets (preserving existing ones)
  ansible.builtin.set_fact:
    newapi_db_password: >-
      {{
        newapi_existing_db_password
        if (newapi_existing_db_password | length > 0)
        else (newapi_generated_secrets.stdout.split()[0] | trim)
      }}
    newapi_session_secret: >-
      {{
        newapi_existing_session_secret
        if (newapi_existing_session_secret | length > 0)
        else (newapi_generated_secrets.stdout.split()[1] | trim)
      }}
    newapi_admin_password: >-
      {{
        newapi_existing_admin_password
        if (newapi_existing_admin_password | length > 0)
        else (newapi_generated_secrets.stdout.split()[2] | trim)
      }}
  no_log: true

- name: Write root-owned credentials.json with mode 0600
  ansible.builtin.copy:
    dest: "{{ newapi_base_dir }}/credentials.json"
    content: |
      {
        "admin_username": {{ newapi_admin_username | to_json }},
        "admin_password": {{ newapi_admin_password | to_json }}
      }
    owner: "{{ 'root' if not (newapi_simulate | bool) else omit }}"
    group: "{{ 'root' if not (newapi_simulate | bool) else omit }}"
    mode: "0600"
  no_log: true
