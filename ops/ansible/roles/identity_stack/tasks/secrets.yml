---
# Tasks for managing durable random secrets for identity_stack

- name: Check if .env.db already exists
  ansible.builtin.stat:
    path: "{{ identity_base_dir }}/.env.db"
  register: identity_env_db_stat

- name: Check if .env.kratos already exists
  ansible.builtin.stat:
    path: "{{ identity_base_dir }}/.env.kratos"
  register: identity_env_kratos_stat

- name: Slurp existing .env.db if present
  ansible.builtin.slurp:
    path: "{{ identity_base_dir }}/.env.db"
  register: identity_existing_env_db_slurp
  when: identity_env_db_stat.stat.exists
  no_log: true

- name: Slurp existing .env.kratos if present
  ansible.builtin.slurp:
    path: "{{ identity_base_dir }}/.env.kratos"
  register: identity_existing_env_kratos_slurp
  when: identity_env_kratos_stat.stat.exists
  no_log: true

- name: Extract existing secrets if available
  ansible.builtin.set_fact:
    identity_existing_db_password: >-
      {{
        identity_existing_env_db_slurp.content | b64decode |
        regex_findall('(?m)^POSTGRES_PASSWORD=(.+)$') | first | default('') | trim
        if (identity_env_db_stat.stat.exists and identity_existing_env_db_slurp.content is defined) else ''
      }}
    identity_existing_secret_cookie: >-
      {{
        identity_existing_env_kratos_slurp.content | b64decode |
        regex_findall('(?m)^SECRETS_COOKIE=(.+)$') | first | default('') | trim
        if (identity_env_kratos_stat.stat.exists and identity_existing_env_kratos_slurp.content is defined) else ''
      }}
    identity_existing_secret_cipher: >-
      {{
        identity_existing_env_kratos_slurp.content | b64decode |
        regex_findall('(?m)^SECRETS_CIPHER=(.+)$') | first | default('') | trim
        if (identity_env_kratos_stat.stat.exists and identity_existing_env_kratos_slurp.content is defined) else ''
      }}
  no_log: true

- name: Reject incomplete existing secrets instead of rotating credentials
  ansible.builtin.assert:
    that:
      - identity_env_db_stat.stat.exists == identity_env_kratos_stat.stat.exists
      - not identity_env_db_stat.stat.exists or (identity_existing_db_password | length > 0)
      - not identity_env_kratos_stat.stat.exists or (identity_existing_secret_cookie | length >= 32)
      - not identity_env_kratos_stat.stat.exists or (identity_existing_secret_cipher | length == 32)
    fail_msg: Existing identity secret files are incomplete; restore the original files before deploying.
  no_log: true

- name: Generate cryptographically secure random secrets on target if absent
  ansible.builtin.command:
    cmd: python3 -c "import secrets; print(secrets.token_hex(32) + ' ' + secrets.token_hex(32) + ' ' + secrets.token_hex(16))"
  register: identity_generated_secrets
  changed_when: false
  no_log: true
  when: >-
    (identity_existing_db_password | length == 0) or
    (identity_existing_secret_cookie | length == 0) or
    (identity_existing_secret_cipher | length == 0)

- name: Assign final durable secrets (preserving existing ones)
  ansible.builtin.set_fact:
    identity_db_password: >-
      {{
        identity_existing_db_password
        if (identity_existing_db_password | length > 0)
        else (identity_generated_secrets.stdout.split()[0] | trim)
      }}
    identity_secret_cookie: >-
      {{
        identity_existing_secret_cookie
        if (identity_existing_secret_cookie | length > 0)
        else (identity_generated_secrets.stdout.split()[1] | trim)
      }}
    identity_secret_cipher: >-
      {{
        identity_existing_secret_cipher
        if (identity_existing_secret_cipher | length > 0)
        else (identity_generated_secrets.stdout.split()[2] | trim)
      }}
  no_log: true
