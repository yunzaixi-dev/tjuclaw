---
- name: Check if .env.db already exists
  ansible.builtin.stat:
    path: "{{ weknora_base_dir }}/.env.db"
  register: weknora_env_db_stat

- name: Check if .env.app already exists
  ansible.builtin.stat:
    path: "{{ weknora_base_dir }}/.env.app"
  register: weknora_env_app_stat

- name: Slurp existing .env.db if present
  ansible.builtin.slurp:
    path: "{{ weknora_base_dir }}/.env.db"
  register: weknora_existing_env_db_slurp
  when: weknora_env_db_stat.stat.exists
  no_log: true

- name: Slurp existing .env.app if present
  ansible.builtin.slurp:
    path: "{{ weknora_base_dir }}/.env.app"
  register: weknora_existing_env_app_slurp
  when: weknora_env_app_stat.stat.exists
  no_log: true

- name: Extract existing secrets if available
  ansible.builtin.set_fact:
    weknora_existing_db_password: >-
      {{
        weknora_existing_env_db_slurp.content | b64decode |
        regex_findall('(?m)^POSTGRES_PASSWORD=(.+)$') | first | default('') | trim
        if (weknora_env_db_stat.stat.exists and weknora_existing_env_db_slurp.content is defined) else ''
      }}
    weknora_existing_redis_password: >-
      {{
        weknora_existing_env_app_slurp.content | b64decode |
        regex_findall('(?m)^REDIS_PASSWORD=(.+)$') | first | default('') | trim
        if (weknora_env_app_stat.stat.exists and weknora_existing_env_app_slurp.content is defined) else ''
      }}
    weknora_existing_jwt_secret: >-
      {{
        weknora_existing_env_app_slurp.content | b64decode |
        regex_findall('(?m)^JWT_SECRET=(.+)$') | first | default('') | trim
        if (weknora_env_app_stat.stat.exists and weknora_existing_env_app_slurp.content is defined) else ''
      }}
    weknora_existing_aes_key: >-
      {{
        weknora_existing_env_app_slurp.content | b64decode |
        regex_findall('(?m)^SYSTEM_AES_KEY=(.+)$') | first | default('') | trim
        if (weknora_env_app_stat.stat.exists and weknora_existing_env_app_slurp.content is defined) else ''
      }}
  no_log: true

- name: Fail closed on a truncated AES key
  ansible.builtin.assert:
    that:
      - (weknora_existing_aes_key | length == 0) or (weknora_existing_aes_key | length == 32)
    fail_msg: >-
      Existing SYSTEM_AES_KEY is not 32 bytes. Restoring a truncated key would
      make encrypted tenant credentials unreadable. Restore the previous .env.app.

- name: Generate missing WeKnora secrets
  ansible.builtin.command:
    cmd: python3 -c "import secrets; print(secrets.token_hex(32)); print(secrets.token_hex(32)); print(secrets.token_hex(32)); print(secrets.token_hex(16))"
  register: weknora_generated_secrets
  changed_when: false
  no_log: true
  when: >-
    (weknora_existing_db_password | length == 0) or
    (weknora_existing_redis_password | length == 0) or
    (weknora_existing_jwt_secret | length == 0) or
    (weknora_existing_aes_key | length == 0)

- name: Assign final durable secrets
  ansible.builtin.set_fact:
    weknora_db_password: "{{ weknora_existing_db_password if (weknora_existing_db_password | length > 0) else (weknora_generated_secrets.stdout_lines[0] | trim) }}"
    weknora_redis_password: "{{ weknora_existing_redis_password if (weknora_existing_redis_password | length > 0) else (weknora_generated_secrets.stdout_lines[1] | trim) }}"
    weknora_jwt_secret: "{{ weknora_existing_jwt_secret if (weknora_existing_jwt_secret | length > 0) else (weknora_generated_secrets.stdout_lines[2] | trim) }}"
    weknora_aes_key: "{{ weknora_existing_aes_key if (weknora_existing_aes_key | length > 0) else (weknora_generated_secrets.stdout_lines[3] | trim) }}"
  no_log: true
