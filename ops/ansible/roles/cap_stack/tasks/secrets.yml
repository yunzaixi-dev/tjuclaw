---
# Manage durable random ADMIN_KEY for cap_stack
# Never rotate existing secrets on remote

- name: Check if .env.cap already exists
  ansible.builtin.stat:
    path: "{{ cap_base_dir }}/.env.cap"
  register: cap_env_stat

- name: Slurp existing .env.cap if present
  ansible.builtin.slurp:
    path: "{{ cap_base_dir }}/.env.cap"
  register: cap_existing_env_slurp
  when: cap_env_stat.stat.exists
  no_log: true

- name: Extract existing ADMIN_KEY if available
  ansible.builtin.set_fact:
    cap_existing_admin_key: >-
      {{
        cap_existing_env_slurp.content | b64decode |
        regex_findall('(?m)^ADMIN_KEY=(.+)$') | first | default('') | trim
        if (cap_env_stat.stat.exists and cap_existing_env_slurp.content is defined) else ''
      }}
  no_log: true

- name: Reject damaged or empty existing secret
  ansible.builtin.assert:
    that:
      - not cap_env_stat.stat.exists or (cap_existing_admin_key | length >= 12)
      - not cap_env_stat.stat.exists or ((cap_existing_env_slurp.content | b64decode | regex_findall('(?m)^ADMIN_KEY=(.+)$')) | length == 1)
    fail_msg: Existing Cap .env.cap secret file is incomplete or invalid (<12 chars); restore the original file before deploying.
  no_log: true

- name: Generate cryptographically secure random ADMIN_KEY on target if absent
  ansible.builtin.command:
    cmd: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
  register: cap_generated_secret
  changed_when: false
  no_log: true
  when: (cap_existing_admin_key | length == 0)

- name: Assign final durable secrets (preserving existing ones)
  ansible.builtin.set_fact:
    cap_admin_key: >-
      {{
        cap_existing_admin_key
        if (cap_existing_admin_key | length > 0)
        else (cap_generated_secret.stdout | trim)
      }}
  no_log: true
