---
# Tasks for managing durable random secrets for zitadel

- name: Check if .env.db already exists
  ansible.builtin.stat:
    path: "{{ zitadel_base_dir }}/.env.db"
  register: zitadel_env_db_stat

- name: Check if .env.zitadel already exists
  ansible.builtin.stat:
    path: "{{ zitadel_base_dir }}/.env.zitadel"
  register: zitadel_env_zitadel_stat

- name: Slurp existing .env.db if present
  ansible.builtin.slurp:
    path: "{{ zitadel_base_dir }}/.env.db"
  register: zitadel_existing_env_db_slurp
  when: zitadel_env_db_stat.stat.exists
  no_log: true

- name: Slurp existing .env.zitadel if present
  ansible.builtin.slurp:
    path: "{{ zitadel_base_dir }}/.env.zitadel"
  register: zitadel_existing_env_zitadel_slurp
  when: zitadel_env_zitadel_stat.stat.exists
  no_log: true

- name: Extract existing secrets if available
  ansible.builtin.set_fact:
    zitadel_existing_db_password: >-
      {{
        zitadel_existing_env_db_slurp.content | b64decode |
        regex_findall('(?m)^POSTGRES_PASSWORD=(.+)$') | first | default('') | trim
        if (zitadel_env_db_stat.stat.exists and zitadel_existing_env_db_slurp.content is defined) else ''
      }}
    zitadel_existing_masterkey: >-
      {{
        zitadel_existing_env_zitadel_slurp.content | b64decode |
        regex_findall('(?m)^ZITADEL_MASTERKEY=(.+)$') | first | default('') | trim
        if (zitadel_env_zitadel_stat.stat.exists and zitadel_existing_env_zitadel_slurp.content is defined) else ''
      }}
  no_log: true

- name: Reject incomplete existing secrets instead of rotating credentials
  ansible.builtin.assert:
    that:
      - zitadel_env_db_stat.stat.exists == zitadel_env_zitadel_stat.stat.exists
      - not zitadel_env_db_stat.stat.exists or (zitadel_existing_db_password | length > 0)
      - not zitadel_env_zitadel_stat.stat.exists or (zitadel_existing_masterkey | length == 32)
    fail_msg: Existing ZITADEL secret files are incomplete; restore the original files before deploying.
  no_log: true

- name: Generate cryptographically secure random secrets on target if absent
  ansible.builtin.command:
    cmd: python3 -c "import secrets; print(secrets.token_hex(32) + ' ' + secrets.token_urlsafe(32)[:32])"
  register: zitadel_generated_secrets
  changed_when: false
  no_log: true
  when: >-
    (zitadel_existing_db_password | length == 0) or
    (zitadel_existing_masterkey | length == 0)

- name: Assign final durable secrets (preserving existing ones)
  ansible.builtin.set_fact:
    zitadel_db_password: >-
      {{
        zitadel_existing_db_password
        if (zitadel_existing_db_password | length > 0)
        else (zitadel_generated_secrets.stdout.split()[0] | trim)
      }}
    zitadel_masterkey: >-
      {{
        zitadel_existing_masterkey
        if (zitadel_existing_masterkey | length > 0)
        else (zitadel_generated_secrets.stdout.split()[1] | trim)
      }}
  no_log: true
