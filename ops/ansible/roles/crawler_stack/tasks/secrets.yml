---
# Tasks for managing durable random secrets for crawler_stack

- name: Check if .env.db already exists
  ansible.builtin.stat:
    path: "{{ crawler_base_dir }}/.env.db"
  register: crawler_env_db_stat

- name: Check if .env.app already exists
  ansible.builtin.stat:
    path: "{{ crawler_base_dir }}/.env.app"
  register: crawler_env_app_stat

- name: Slurp existing .env.db if present
  ansible.builtin.slurp:
    path: "{{ crawler_base_dir }}/.env.db"
  register: crawler_existing_env_db_slurp
  when: crawler_env_db_stat.stat.exists
  no_log: true

- name: Slurp existing .env.app if present
  ansible.builtin.slurp:
    path: "{{ crawler_base_dir }}/.env.app"
  register: crawler_existing_env_app_slurp
  when: crawler_env_app_stat.stat.exists
  no_log: true

- name: Extract existing secrets if available
  ansible.builtin.set_fact:
    crawler_existing_db_password: >-
      {{
        crawler_existing_env_db_slurp.content | b64decode |
        regex_findall('(?m)^POSTGRES_PASSWORD=(.+)$') | first | default('') | trim
        if (crawler_env_db_stat.stat.exists and crawler_existing_env_db_slurp.content is defined) else ''
      }}
    crawler_existing_s3_key: >-
      {{
        crawler_existing_env_app_slurp.content | b64decode |
        regex_findall('(?m)^CRAWLER_S3_ACCESS_KEY_ID=(.+)$') | first | default('') | trim
        if (crawler_env_app_stat.stat.exists and crawler_existing_env_app_slurp.content is defined) else ''
      }}
    crawler_existing_s3_secret: >-
      {{
        crawler_existing_env_app_slurp.content | b64decode |
        regex_findall('(?m)^CRAWLER_S3_SECRET_ACCESS_KEY=(.+)$') | first | default('') | trim
        if (crawler_env_app_stat.stat.exists and crawler_existing_env_app_slurp.content is defined) else ''
      }}
  no_log: true

- name: Generate cryptographically secure random DB password if absent
  ansible.builtin.command:
    cmd: python3 -c "import secrets; print(secrets.token_hex(32))"
  register: crawler_generated_password
  changed_when: false
  no_log: true
  when: (crawler_existing_db_password | length == 0)

- name: Assign final durable secrets
  ansible.builtin.set_fact:
    crawler_db_password: >-
      {{
        crawler_existing_db_password
        if (crawler_existing_db_password | length > 0)
        else (crawler_generated_password.stdout | trim)
      }}
    crawler_final_s3_key: >-
      {{
        crawler_s3_access_key_id
        if (crawler_s3_access_key_id | length > 0)
        else crawler_existing_s3_key
      }}
    crawler_final_s3_secret: >-
      {{
        crawler_s3_secret_access_key
        if (crawler_s3_secret_access_key | length > 0)
        else crawler_existing_s3_secret
      }}
  no_log: true
