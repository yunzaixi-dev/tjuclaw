---
- name: Restart dedicated NewAPI HAProxy service
  ansible.builtin.systemd:
    name: "{{ newapi_origin_service_name }}"
    state: restarted
    daemon_reload: true
  when: not (newapi_origin_simulate | bool)

- name: Reload dedicated NewAPI HAProxy service
  ansible.builtin.systemd:
    name: "{{ newapi_origin_service_name }}"
    state: reloaded
  when: not (newapi_origin_simulate | bool)
