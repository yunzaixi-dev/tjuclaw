---
# Preflight validation for newapi_origin role

- name: Validate variable inputs
  ansible.builtin.assert:
    that:
      - newapi_origin_hostname is defined
      - (newapi_origin_hostname | length) > 0
      - (newapi_origin_hostname | string) is match('^[a-zA-Z0-9.-]+$')
      - newapi_origin_port is defined
      - (newapi_origin_port | int) > 0
      - (newapi_origin_port | int) < 65536
      - newapi_origin_backend_address is defined
      - (newapi_origin_backend_address | length) > 0
      - newapi_origin_backend_port is defined
      - (newapi_origin_backend_port | int) > 0
      - (newapi_origin_backend_port | int) < 65536
      - newapi_origin_tls_pem is defined
      - (newapi_origin_tls_pem | length) > 0
      - newapi_origin_service_name is defined
      - (newapi_origin_service_name | string) is match('^[a-zA-Z0-9_-]+$')
      - newapi_origin_config_dir is defined
      - (newapi_origin_config_dir | string) is match('^/[a-zA-Z0-9_.-]+(/.*)?$')
      - newapi_origin_config_file is defined
      - (newapi_origin_config_file | string) is match('^/[a-zA-Z0-9_.-]+(/.*)?$')
      - newapi_origin_unit_file is defined
      - (newapi_origin_unit_file | string) is match('^/[a-zA-Z0-9_.-]+(/.*)?$')
    fail_msg: "Invalid configuration variables for newapi_origin role."

- name: Validate optional auth configuration variables
  ansible.builtin.assert:
    that:
      - (newapi_origin_auth_hostname | length) > 0
      - (newapi_origin_auth_hostname | string) is match('^[a-zA-Z0-9.-]+$')
      - (newapi_origin_auth_backend_address | length) > 0
      - (newapi_origin_auth_backend_port | int) > 0
      - (newapi_origin_auth_backend_port | int) < 65536
      - (newapi_origin_auth_redirect_target | length) > 0
    fail_msg: "Invalid auth configuration variables for newapi_origin role."
  when: newapi_origin_auth_enabled | bool

- name: Check target TLS PEM file existence
  ansible.builtin.stat:
    path: "{{ newapi_origin_tls_pem }}"
  register: newapi_origin_tls_stat

- name: Assert TLS PEM file exists, is a regular file, and is not empty
  ansible.builtin.assert:
    that:
      - newapi_origin_tls_stat.stat.exists
      - newapi_origin_tls_stat.stat.isreg
      - newapi_origin_tls_stat.stat.size > 0
    fail_msg: >-
      TLS PEM file {{ newapi_origin_tls_pem }} is missing, not a regular file, or empty.
      A valid TLS certificate bundle containing cert and private key must be prepared before deploying origin.

- name: Validate TLS PEM format with openssl
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ newapi_origin_tls_pem }}"
      - -noout
  changed_when: false
  register: newapi_origin_x509_check

- name: Validate TLS PEM private key with openssl
  ansible.builtin.command:
    argv:
      - openssl
      - pkey
      - -in
      - "{{ newapi_origin_tls_pem }}"
      - -noout
  changed_when: false
  register: newapi_origin_pkey_check

- name: Validate certificate matches origin hostname with openssl checkhost
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ newapi_origin_tls_pem }}"
      - -noout
      - -checkhost
      - "{{ newapi_origin_hostname }}"
  changed_when: false
  failed_when: false
  register: newapi_origin_checkhost_origin

- name: Assert certificate matches origin hostname
  ansible.builtin.assert:
    that:
      - newapi_origin_checkhost_origin.rc == 0
      - "'does match certificate' in newapi_origin_checkhost_origin.stdout"
    fail_msg: >-
      TLS certificate {{ newapi_origin_tls_pem }} does not match hostname {{ newapi_origin_hostname }}.
      Certificate must match the configured origin hostname.

- name: Validate certificate matches auth hostname with openssl checkhost when auth routing is enabled
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ newapi_origin_tls_pem }}"
      - -noout
      - -checkhost
      - "{{ newapi_origin_auth_hostname }}"
  changed_when: false
  failed_when: false
  register: newapi_origin_checkhost_auth
  when: newapi_origin_auth_enabled | bool

- name: Assert certificate matches auth hostname when auth routing is enabled
  ansible.builtin.assert:
    that:
      - newapi_origin_checkhost_auth.rc == 0
      - "'does match certificate' in newapi_origin_checkhost_auth.stdout"
    fail_msg: >-
      TLS certificate {{ newapi_origin_tls_pem }} does not match auth hostname {{ newapi_origin_auth_hostname }}.
      A valid TLS certificate covering {{ newapi_origin_auth_hostname }} must be provisioned before enabling auth routing.
  when: newapi_origin_auth_enabled | bool
