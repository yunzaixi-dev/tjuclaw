name: Deploy Draw to EdgeOne

on:
  push:
    branches: [release]
    paths:
      - 'draw/**'
      - 'Taskfile.yml'
      - '.github/workflows/deploy-draw.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-draw
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'yunzaixi-dev/tjuclaw' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/release'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: draw/pnpm-lock.yaml

      - name: Install locked draw dependencies
        run: pnpm --dir draw install --frozen-lockfile --fetch-timeout 600000 --network-concurrency 4

      - name: Build static Draw artifact
        run: pnpm --dir draw build

      - name: Publish verified Draw artifact
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_DRAW_PROJECT_NAME || 'tjuclaw-draw' }}
          EDGEONE_AREA: ${{ vars.EDGEONE_AREA || 'global' }}
        run: |
          set -euo pipefail
          test -n "$EDGEONE_TOKEN" || { echo 'Missing production secret EDGEONE_TOKEN'; exit 1; }
          test -n "$EDGEONE_PROJECT_NAME" || { echo 'Missing production variable EDGEONE_DRAW_PROJECT_NAME'; exit 1; }
          test -f draw/dist/index.html
          rm -rf edge-deploy
          mkdir -p edge-deploy
          cp -R draw/dist edge-deploy/assets
          node -e 'require("fs").writeFileSync("edge-deploy/edgeone.json", JSON.stringify({outputDirectory:"assets"}))'
          cd edge-deploy
          npx --yes edgeone@1.6.37 makers build
          test -f .edgeone/assets/index.html
          npx --yes edgeone@1.6.37 makers deploy .edgeone --name "$EDGEONE_PROJECT_NAME" --env production --area "$EDGEONE_AREA" --token "$EDGEONE_TOKEN" --json
