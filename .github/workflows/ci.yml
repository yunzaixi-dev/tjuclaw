name: CI

on:
  push:
    branches: [dev, release]
    tags: ['v*']
  pull_request:
    branches: [dev, release]
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy the API to production after all checks pass'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# The repository is public, so every job runs on a standard GitHub-hosted
# runner: free, four dedicated cores each, and nothing shared with production.
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  mirror:
    name: Mirror reviewed source to GitLab
    if: >-
      github.repository == 'yunzaixi-dev/tjuclaw' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Explicit tag refs avoid checkout v4 flattening annotated tags to github.sha.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || '' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Push only the selected ref without force
        env:
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        run: node scripts/gitlab-sync.mjs

  plan:
    name: Select the jobs this change needs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.plan.outputs.web }}
      docs: ${{ steps.plan.outputs.docs }}
      api: ${{ steps.plan.outputs.api }}
      cli: ${{ steps.plan.outputs.cli }}
      crawler: ${{ steps.plan.outputs.crawler }}
      ops: ${{ steps.plan.outputs.ops }}
      integration: ${{ steps.plan.outputs.integration }}
      sandbox: ${{ steps.plan.outputs.sandbox }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Compare with the last successful run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-plan.mjs

  check:
    name: Pinned component checks and portable integration build
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      crawler-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crawler_test
          POSTGRES_PASSWORD: crawler_test
          POSTGRES_DB: crawler_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U crawler_test -d crawler_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-components
        with:
          server-key: ${{ secrets.SERVER_READ_KEY }}
          cli-key: ${{ secrets.CLI_READ_KEY }}
          crawler-key: ${{ secrets.CRAWLER_READ_KEY }}
      - name: Install system test dependencies
        run: |
          if command -v ffmpeg >/dev/null && command -v gcc >/dev/null && docker compose version >/dev/null 2>&1 \
            && dpkg -s poppler-utils webp python3-pil >/dev/null 2>&1; then
            echo 'Runner image already has system test dependencies'
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends docker-compose-v2 ffmpeg gcc iproute2 libc6-dev poppler-utils webp python3 python3-pil
          fi
      - uses: ./.github/actions/setup
        with:
          profile: portable
          bun: ${{ needs.plan.outputs.crawler }}
          go-cache: ${{ needs.plan.outputs.api == 'true' || needs.plan.outputs.cli == 'true' }}
          pnpm-cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      # Each group below runs only when the plan saw a change it reads;
      # together they are `task check`.
      - name: Check repository tooling
        run: task check:tooling
      - name: Check Web client
        if: needs.plan.outputs.web == 'true'
        run: task check:web
      - name: Check documentation site
        if: needs.plan.outputs.docs == 'true'
        run: task check:docs
      - name: Check Go API
        if: needs.plan.outputs.api == 'true'
        env:
          # cli:test already races. Race the API here instead of a second full compile.
          GO_TEST_FLAGS: -race
        run: task check:api
      - name: Check campus CLI
        if: needs.plan.outputs.cli == 'true'
        run: task check:cli
      - name: Check crawler
        if: needs.plan.outputs.crawler == 'true'
        env:
          CRAWLER_TEST_DATABASE_URL: postgresql://crawler_test:crawler_test@127.0.0.1:${{ job.services.crawler-postgres.ports['5432'] }}/crawler_test
        run: task check:crawler
      - name: Build documentation site
        # A release push that touches Docs is built and published by deploy-docs.yml.
        if: needs.plan.outputs.docs == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/release')
        run: task docs:build
      - name: Build immutable API deployment artifact
        if: needs.plan.outputs.api == 'true'
        run: |
          mkdir -p backend/bin/deploy
          (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/deploy/api ./cmd/api)
          node scripts/deploy-release.mjs --manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.plan.outputs.api == 'true'
        with:
          name: api-${{ github.sha }}
          path: backend/bin/deploy/
          if-no-files-found: error
          retention-days: 14

  ops:
    name: Ansible deployment checks
    needs: plan
    if: needs.plan.outputs.ops == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
      - name: Install Docker Compose CLI plugin
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo 'Runner image already has Docker Compose'
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends docker-compose-v2
          fi
      - name: Syntax-check playbooks once
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ops/ansible/ansible.cfg
        run: |
          uv run --no-project --with-requirements ops/ansible/requirements.txt \
            bash -euo pipefail -c '
              for play in discover render-origin prepare-services deploy-identity deploy-newapi deploy-newapi-origin deploy-api deploy-crawler deploy-cap deploy-zitadel deploy-weknora; do
                ansible-playbook -i ops/ansible/inventory.example.yml "ops/ansible/playbooks/$play.yml" --syntax-check
              done
            '
      - name: Rollback simulations
        # Each file works in its own temporary directory on ephemeral ports, so files run in parallel.
        run: node --test ops/ansible/tests/*.test.mjs scripts/deploy-release.test.mjs

  sandbox-images:
    name: Pinned sandbox gateway and controller images
    needs: plan
    # Job conditions cannot read secrets; the access step below skips the build when the key is absent.
    if: github.repository == 'yunzaixi-dev/tjuclaw' && needs.plan.outputs.sandbox == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read pinned CLI reference
        id: cli
        run: |
          entry=$(git ls-tree HEAD cli)
          test "$(printf '%s' "$entry" | awk '{print $1}')" = 160000
          echo "sha=$(printf '%s' "$entry" | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Require sandbox repository access
        id: access
        env:
          SANDBOX_READ_KEY: ${{ secrets.SANDBOX_READ_KEY }}
        run: |
          if [ -z "$SANDBOX_READ_KEY" ]; then
            echo '::notice::SANDBOX_READ_KEY is not configured; skipping pinned sandbox image verification'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout pinned CLI
        if: steps.access.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yunzaixi-dev/tjucli
          ref: ${{ steps.cli.outputs.sha }}
          path: cli
          ssh-key: ${{ secrets.CLI_READ_KEY }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-sandbox
        if: steps.access.outputs.available == 'true'
        with:
          sandbox-key: ${{ secrets.SANDBOX_READ_KEY }}
      - name: Build and smoke-test sandbox images
        if: steps.access.outputs.available == 'true'
        run: |
          docker build --file sandbox/image/controller.Dockerfile --tag tjuclaw-controller:ci .
          bash sandbox/ops/controller-image-smoke.sh tjuclaw-controller:ci
          docker build --file sandbox/image/gateway.Dockerfile --tag tjuclaw-gateway:ci .
          docker image inspect tjuclaw-gateway:ci --format '{{.Config.User}}' | grep -qx 65532:65532

  deploy:
    # Sandbox images are verified but not deployed; they do not gate the API release.
    # Production deploys are manual: the runner's link to the API host is too
    # slow for every push (use `task ops:api:deploy` locally, or run CI by hand
    # with deploy_api). An unchanged backend reuses the running binary.
    needs: [check, integration, ops]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_api && github.ref == 'refs/heads/release' && github.repository == 'yunzaixi-dev/tjuclaw'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  integration:
    name: Real Kratos authentication, Cap and task ownership
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUTH_TEST_IMAGES: oryd/kratos:v26.2.0 postgres:16.14-alpine axllent/mailpit:v1.27.8 tiago2/cap:3.1.11 valkey/valkey:9-alpine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start pulling pinned identity and CAPTCHA test images
        # Runs behind the toolchain setup; the wait step below pulls whatever is still missing.
        run: |
          nohup bash -c 'printf "%s\n" $AUTH_TEST_IMAGES | xargs -P 5 -I {} sh -c "docker image inspect {} >/dev/null 2>&1 || docker pull -q {}"' \
            > "$RUNNER_TEMP/auth-image-pull.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/auth-image-pull.pid"
      - uses: ./.github/actions/checkout-components
        with:
          server-key: ${{ secrets.SERVER_READ_KEY }}
          cli-key: ${{ secrets.CLI_READ_KEY }}
          crawler-key: ${{ secrets.CRAWLER_READ_KEY }}
      - name: Install Docker Compose CLI plugin
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo 'Runner image already has Docker Compose'
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends docker-compose-v2
          fi
      - uses: ./.github/actions/setup
        with:
          profile: integration
          bun: 'false'
          pnpm-cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Validate Compose configuration and context
        run: |
          task compose:config
          task compose:context
      - name: Install Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Wait for the pinned identity and CAPTCHA test images
        run: |
          tail --pid="$(cat "$RUNNER_TEMP/auth-image-pull.pid")" -f /dev/null
          cat "$RUNNER_TEMP/auth-image-pull.log"
          for image in $AUTH_TEST_IMAGES; do
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
          done
      - name: Build Web client
        # The check job type-checks the client; do not compile it twice.
        run: pnpm --dir frontend exec vite build
      - name: Run real auth regression
        env:
          AUTH_TEST_EVIDENCE: '0'
        run: pnpm exec playwright test --config scripts/auth.playwright.config.mjs
      - name: Run isolated browser session and vault regressions
        env:
          AUTH_TEST_EVIDENCE: '0'
          TJUCLAW_SESSION_E2E: '1'
        run: pnpm exec playwright test --config scripts/auth.playwright.config.mjs --grep 'browser-to-API (Agent reply|vault)'
      - name: Clean up exact test stack
        if: always()
        run: node scripts/auth-test-stack.mjs --down
