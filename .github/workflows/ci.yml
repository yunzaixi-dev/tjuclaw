name: CI

on:
  push:
    branches: [dev, release]
    tags: ['v*']
  pull_request:
    branches: [dev, release]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  mirror:
    name: Mirror reviewed source to GitLab
    if: >-
      github.repository == 'yunzaixi-dev/tjuclaw' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: tjuclaw
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Explicit tag refs avoid checkout v4 flattening annotated tags to github.sha.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || '' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Push only the selected ref without force
        env:
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        run: node scripts/gitlab-sync.mjs

  check:
    name: Pinned component checks and portable integration build
    runs-on: tjuclaw
    timeout-minutes: 30
    services:
      crawler-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crawler_test
          POSTGRES_PASSWORD: crawler_test
          POSTGRES_DB: crawler_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U crawler_test -d crawler_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-components
        with:
          server-key: ${{ secrets.SERVER_READ_KEY }}
          cli-key: ${{ secrets.CLI_READ_KEY }}
          crawler-key: ${{ secrets.CRAWLER_READ_KEY }}
      - name: Install media conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg gcc libc6-dev poppler-utils webp python3 python3-pil
      - uses: ./.github/actions/setup
        with:
          profile: portable
          pnpm-cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Check all pinned components
        env:
          CRAWLER_TEST_DATABASE_URL: postgresql://crawler_test:crawler_test@127.0.0.1:${{ job.services.crawler-postgres.ports['5432'] }}/crawler_test
        run: task check
      - name: Go race regressions
        run: |
          (cd backend && go test -race ./...)
          (cd cli && go test -race ./...)
      - name: Build integration deliverables
        run: |
          task docs:build
          task api:build
          task cli:build
      - name: Build immutable API deployment artifact
        run: |
          mkdir -p backend/bin/deploy
          (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/deploy/api ./cmd/api)
          node scripts/deploy-release.mjs --manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-${{ github.sha }}
          path: backend/bin/deploy/
          if-no-files-found: error
          retention-days: 14

  ops:
    name: Ansible deployment checks
    runs-on: tjuclaw
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
      - name: Check playbooks and rollback regressions
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ops/ansible/ansible.cfg
        run: |
          for play in discover render-origin prepare-services deploy-identity deploy-newapi deploy-newapi-origin deploy-api deploy-crawler deploy-cap deploy-zitadel deploy-weknora; do
            uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/ansible/inventory.example.yml "ops/ansible/playbooks/$play.yml" --syntax-check
          done
          node --test ops/ansible/tests/*.test.mjs scripts/deploy-release.test.mjs

  deploy:
    needs: [check, integration, ops]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release' && github.repository == 'yunzaixi-dev/tjuclaw'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  integration:
    name: Real Kratos authentication, Cap and task ownership
    runs-on: tjuclaw
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-components
        with:
          server-key: ${{ secrets.SERVER_READ_KEY }}
          cli-key: ${{ secrets.CLI_READ_KEY }}
          crawler-key: ${{ secrets.CRAWLER_READ_KEY }}
      - uses: ./.github/actions/setup
        with:
          profile: integration
          pnpm-cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Validate Compose configuration and context
        run: |
          task compose:config
          task compose:context
      - name: Install Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Pre-pull pinned identity and CAPTCHA test images
        run: |
          docker pull oryd/kratos:v26.2.0
          docker pull postgres:16.14-alpine
          docker pull axllent/mailpit:v1.27.8
          docker pull tiago2/cap:3.1.11
          docker pull valkey/valkey:9-alpine
      - name: Run real auth regression
        run: task auth:test
      - name: Clean up exact test stack
        if: always()
        run: node scripts/auth-test-stack.mjs --down
