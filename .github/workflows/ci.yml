name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  mirror:
    name: Mirror reviewed source to GitLab
    if: >-
      github.repository == 'yunzaixi-dev/tjuclaw' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Push only the selected ref without force
        env:
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        run: node scripts/gitlab-sync.mjs

  check:
    name: Pinned component checks and portable integration build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-components
        with:
          server-key: ${{ secrets.SERVER_READ_KEY }}
          cli-key: ${{ secrets.CLI_READ_KEY }}
      - uses: ./.github/actions/setup
        with:
          profile: portable
      - name: Check all pinned components
        run: task check
      - name: Go race regressions
        run: |
          (cd backend && go test -race ./...)
          (cd cli && go test -race ./...)
      - name: Build integration deliverables
        run: |
          task docs:build
          task api:build
          task cli:build

  integration:
    name: Real Kratos authentication and task ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-components
        with:
          server-key: ${{ secrets.SERVER_READ_KEY }}
          cli-key: ${{ secrets.CLI_READ_KEY }}
      - uses: ./.github/actions/setup
        with:
          profile: integration
      - name: Validate Compose configuration and context
        run: |
          task compose:config
          task compose:context
      - name: Install Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Pre-pull exact auth test Compose images
        run: docker compose -p tjuclaw-auth-test -f ops/auth/compose.yaml pull
      - name: Run real auth regression
        run: task auth:test
      - name: Clean up exact test stack
        if: always()
        run: docker compose -p tjuclaw-auth-test -f ops/auth/compose.yaml down --volumes --remove-orphans || true
