name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Portable checks and Go race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          profile: portable

      - name: Run portable checks
        run: task check

      - name: Run Go race tests
        run: |
          cd backend
          go test -race ./...

  browser:
    name: Browser UI and workspace regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          profile: portable

      - name: Install Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run UI test then workspace test serially
        run: |
          task ui:test
          task workspace:test

  integration:
    name: Local auth integration regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          profile: integration

      - name: Validate Compose configuration and context
        run: |
          task compose:config
          task compose:context

      - name: Install Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Pre-pull exact auth test Compose images
        run: |
          docker compose -p tjuclaw-auth-test -f ops/auth/compose.yaml pull

      - name: Run real auth regression
        run: task auth:test

      - name: Clean up exact test stack
        if: always()
        run: |
          docker compose -p tjuclaw-auth-test -f ops/auth/compose.yaml down --volumes --remove-orphans || true

  build-artifacts:
    name: Build Web, Docs, API and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          profile: portable

      - name: Build Web
        run: task web:build

      - name: Build Docs
        run: task docs:build

      - name: Build API
        run: task api:build

      - name: Build CLI
        run: task cli:build

      - name: Upload Web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload API artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-${{ github.sha }}
          path: backend/bin/api
          if-no-files-found: error
          retention-days: 7

      - name: Upload CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tjucli-${{ github.sha }}
          path: backend/bin/tjucli
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux amd64 Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf file

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          profile: linux
          rust: 'true'

      - name: Build Debian package
        run: task linux:build

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ github.sha }}
          path: frontend/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android debug arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx768m -XX:MaxMetaspaceSize=384m" -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process'
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select installed Java 17 and Android NDK
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Android SDK platform, build-tools and NDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Go for Task installation
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Install Task 3.49.1
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.49.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Rust (minimal stable) and Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Run CI preflight for Android
        run: node scripts/ci-preflight.mjs android

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 600000 --network-concurrency 4

      - name: Build Android debug APK
        run: task android:build

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-${{ github.sha }}
          path: frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
