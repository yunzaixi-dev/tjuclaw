name: 'Setup CI toolchain'
description: 'Sets up Node.js, pnpm, Go, Task, and runs preflight verification'
inputs:
  profile:
    description: 'Preflight profile to verify (portable, linux, android, integration)'
    required: false
    default: 'portable'
  pnpm-cache-dependency-path:
    description: 'Lockfiles used to key the pnpm cache'
    required: false
    default: 'pnpm-lock.yaml'
  rust:
    description: 'Whether to install stable Rust'
    required: false
    default: 'false'
  bun:
    description: 'Whether to install Bun and the crawler dependencies'
    required: false
    default: 'true'
  go-cache:
    description: 'Whether to restore the Go module and build cache'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up pinned pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        run_install: false
    - name: Set up Node.js 24
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: ${{ inputs.pnpm-cache-dependency-path }}

    - name: Set up Bun 1.3.14
      if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.1
      with:
        bun-version: '1.3.14'
    - name: Restore Bun cache
      if: inputs.bun == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ hashFiles('crawler/bun.lock') }}
        restore-keys: bun-

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: backend/go.mod
        cache: ${{ inputs.go-cache }}
        # The modules live in the pinned components; without these paths
        # setup-go finds no go.sum at the root and never restores a cache.
        cache-dependency-path: |
          backend/go.sum
          cli/go.sum

    # Prefer a Task already on the runner, then a cached build; compile only on a cold cache.
    - name: Check for a preinstalled Task 3.49.1
      id: task-preinstalled
      shell: bash
      run: |
        if command -v task >/dev/null && task --version | grep -qE '(^|[^0-9.])v?3\.49\.1([^0-9]|$)'; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Restore Task 3.49.1
      id: task-cache
      if: steps.task-preinstalled.outputs.found != 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/tjuclaw-task
        key: task-3.49.1-${{ runner.os }}-${{ runner.arch }}
    - name: Install Task 3.49.1
      if: steps.task-preinstalled.outputs.found != 'true'
      shell: bash
      run: |
        if [ "${{ steps.task-cache.outputs.cache-hit }}" != 'true' ]; then
          GOBIN="$HOME/.cache/tjuclaw-task" go install github.com/go-task/task/v3/cmd/task@v3.49.1
        fi
        echo "$HOME/.cache/tjuclaw-task" >> "$GITHUB_PATH"

    - name: Set up Rust (minimal stable)
      if: inputs.rust == 'true'
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable

    - name: Run CI preflight
      shell: bash
      run: node scripts/ci-preflight.mjs "${{ inputs.profile }}"

    - name: Install locked dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile --fetch-timeout 600000 --network-concurrency 4
        pnpm --dir frontend install --frozen-lockfile --fetch-timeout 600000 --network-concurrency 4
        if [ "${{ inputs.bun }}" = 'true' ]; then (cd crawler && bun install --frozen-lockfile); fi
