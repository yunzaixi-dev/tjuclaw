name: 'Setup CI toolchain'
description: 'Sets up Node.js, pnpm, Go, Task, and runs preflight verification'
inputs:
  profile:
    description: 'Preflight profile to verify (portable, linux, android, integration)'
    required: false
    default: 'portable'
  rust:
    description: 'Whether to install stable Rust'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'

    - name: Set up pinned pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        run_install: false

    - name: Set up Bun 1.3.14
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.1
      with:
        bun-version: '1.3.14'

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: backend/go.mod
        cache: false

    - name: Install Task 3.49.1
      shell: bash
      run: |
        go install github.com/go-task/task/v3/cmd/task@v3.49.1
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Set up Rust (minimal stable)
      if: inputs.rust == 'true'
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable

    - name: Run CI preflight
      shell: bash
      run: node scripts/ci-preflight.mjs "${{ inputs.profile }}"

    - name: Install locked dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile --fetch-timeout 600000 --network-concurrency 4
        pnpm --dir frontend install --frozen-lockfile --fetch-timeout 600000 --network-concurrency 4
        (cd crawler && bun install --frozen-lockfile)
