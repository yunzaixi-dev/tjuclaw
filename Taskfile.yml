version: '3'

# Only toolchain paths; never load the PAT-bearing root .env.local.
dotenv: ['.env.toolchain.local']

tasks:
  default:
    desc: List development commands
    cmds: [task --list]
  setup:
    desc: Install locked JS dependencies and local Git hooks
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm --dir frontend install --frozen-lockfile
      - (cd crawler && bun install --frozen-lockfile)
      - pnpm git:setup
  doctor:
    desc: Check common development tools
    cmds: [node scripts/doctor.mjs]
  dev:
    desc: Run Web client and Go API (Ctrl+C stops both)
    deps: [web:dev, api:dev]
  web:dev:
    desc: Run Web client on loopback port 1420
    cmds: [pnpm --dir frontend dev]
  web:build:
    desc: Build Web client
    cmds: [pnpm --dir frontend build]
  web:preview:
    desc: Preview built Web client on loopback port 4173
    cmds: [pnpm --dir frontend preview]
  ui:install:
    desc: Install the Chromium browser used by UI regression tests
    cmds: [pnpm exec playwright install chromium]
  ui:test:
    desc: Build and test appearance, keyboard access and four responsive sizes
    cmds:
      - task --dir frontend ui:test
  auth:up:
    desc: Start isolated local Kratos, PostgreSQL and captured mail (no external email)
    cmds:
      - docker compose --env-file ops/auth/.env.local -f ops/auth/compose.yaml up --detach 2>/dev/null || docker compose -f ops/auth/compose.yaml up --detach
  auth:down:
    desc: Stop local auth services without deleting identities
    cmds: [docker compose -f ops/auth/compose.yaml down]
  auth:dev:
    desc: Run Go with local Kratos on port 14433 (use alongside web:dev)
    dir: backend
    env:
      KRATOS_PUBLIC_URL: http://127.0.0.1:14433
      APP_PUBLIC_URL: http://127.0.0.1:1420
    cmds: [go run ./cmd/api]
  auth:serve:
    desc: Run API using ignored .env.auth.local (server-only configuration)
    dir: backend
    dotenv: ['../.env.auth.local']
    cmds: [go run ./cmd/api]
  auth:test:
    desc: Test real Kratos email flows using the isolated local mailbox
    cmds:
      - task: web:build
      - pnpm exec playwright test --config scripts/auth.playwright.config.mjs {{.CLI_ARGS}}
  workspace:test:
    desc: Test task workspace client behavior using isolated mocks
    cmds:
      - task --dir frontend workspace:test -- {{.CLI_ARGS}}
  docs:dev:
    desc: Run Fumadocs on port 3030
    cmds: [node scripts/docs-dev.mjs]
  audit:index:
    desc: Validate local screenshot descriptions and generate the private audit index
    cmds: [node scripts/audit-index.mjs]
  audit:dev:
    desc: Run the local-only visual audit desk on loopback port 1421
    cmds: [pnpm --dir frontend exec vite --mode audit]
  audit:test:
    desc: Test local audit evidence boundaries using isolated fixtures
    cmds: [node --experimental-strip-types --test scripts/audit.test.mjs]
  audit:auth:
    desc: Run real auth regression and import four-size light/dark evidence locally
    cmds:
      - task: auth:test
      - node scripts/audit-auth-import.mjs
  audit:auth:import:
    desc: Import a fully passing auth test run into the ignored local audit collection
    cmds: [node scripts/audit-auth-import.mjs]
  audit:ui:
    desc: Verify the local audit UI with existing private evidence (no product build)
    cmds: [pnpm exec playwright test --config scripts/audit.playwright.config.mjs]
  docs:build:
    desc: Build documentation
    cmds:
      - pnpm --filter @tjuclaw/docs build
  docs:design:
    desc: Export docs homepage to DESIGN.md at repository root
    cmds: [node scripts/generate-design-doc.mjs]
  docs:serve:
    desc: Serve built documentation
    cmds: [pnpm --filter @tjuclaw/docs start]
  ops:check:
    desc: Validate Ansible playbook syntax without contacting hosts
    env:
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ops/ansible/ansible.cfg'
    cmds:
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/playbooks/discover.yml --syntax-check
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i localhost, ops/ansible/playbooks/render-origin.yml --syntax-check
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/playbooks/deploy-api.yml --syntax-check
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/playbooks/prepare-services.yml --syntax-check
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/playbooks/deploy-identity.yml --syntax-check
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/playbooks/deploy-newapi.yml --syntax-check
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/playbooks/deploy-newapi-origin.yml --syntax-check
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/playbooks/deploy-crawler.yml --syntax-check
  ops:test:
    desc: Verify origin, API deployment and identity secret preservation locally
    cmds:
      - node --test ops/ansible/tests/*.test.mjs
      - python3 ops/ansible/tests/identity.py
  ops:services:prepare:
    desc: Install Compose and initialize the API environment on the configured host
    env:
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ops/ansible/ansible.cfg'
    preconditions:
      - test -f ops/local/ansible-inventory.yml
    cmds:
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/local/ansible-inventory.yml ops/ansible/playbooks/prepare-services.yml
  ops:identity:deploy:
    desc: Deploy isolated Kratos and PostgreSQL (requires production SMTP configuration)
    env:
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ops/ansible/ansible.cfg'
    preconditions:
      - test -f ops/local/ansible-inventory.yml
    cmds:
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/local/ansible-inventory.yml ops/ansible/playbooks/deploy-identity.yml
  ops:newapi:deploy:
    desc: Deploy and initialize the internal NewAPI model gateway
    env:
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ops/ansible/ansible.cfg'
    preconditions:
      - test -f ops/local/ansible-inventory.yml
    cmds:
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/local/ansible-inventory.yml ops/ansible/playbooks/deploy-newapi.yml
  ops:crawler:deploy:
    desc: Deploy the verified crawler image and isolated PostgreSQL with rollback
    env:
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ops/ansible/ansible.cfg'
    preconditions:
      - test -f ops/local/ansible-inventory.yml
      - test -f ops/local/crawler.yml
    cmds:
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/local/ansible-inventory.yml ops/ansible/playbooks/deploy-crawler.yml -e @ops/local/crawler.yml
  ops:newapi:origin:deploy:
    desc: Deploy the dedicated NewAPI HTTPS origin (requires a provisioned TLS PEM)
    env:
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ops/ansible/ansible.cfg'
    preconditions:
      - test -f ops/local/ansible-inventory.yml
    cmds:
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/local/ansible-inventory.yml ops/ansible/playbooks/deploy-newapi-origin.yml
  ops:discover:
    desc: Read-only inventory of the explicitly configured origin host
    env:
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ops/ansible/ansible.cfg'
    preconditions:
      - sh: test -f ops/local/ansible-inventory.yml
        msg: Copy ops/ansible/inventory.example.yml to ops/local/ansible-inventory.yml and configure the confirmed host first.
    cmds:
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/local/ansible-inventory.yml ops/ansible/playbooks/discover.yml
  ops:origin:render:
    desc: Render an origin candidate locally without modifying live HAProxy
    env:
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ops/ansible/ansible.cfg'
    preconditions:
      - sh: test -f ops/local/origin.yml
        msg: Copy ops/ansible/origin.example.yml to ops/local/origin.yml and fill verified origin settings first.
    cmds:
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i localhost, ops/ansible/playbooks/render-origin.yml -e @ops/local/origin.yml
  api:dev:
    desc: Run Go API on loopback port 8080
    dir: backend
    cmds: [go run ./cmd/api]
  ops:api:deploy:
    desc: Deploy a verified API artifact using the explicit local production configuration
    env:
      ANSIBLE_CONFIG: '{{.ROOT_DIR}}/ops/ansible/ansible.cfg'
    preconditions:
      - sh: test -f ops/local/ansible-inventory.yml && test -f ops/local/deploy.yml
        msg: Configure the ignored inventory and deploy.yml with a verified artifact and release SHA first.
    cmds:
      - uv run --no-project --with-requirements ops/ansible/requirements.txt ansible-playbook -i ops/local/ansible-inventory.yml ops/ansible/playbooks/deploy-api.yml -e @ops/local/deploy.yml
  api:build:
    desc: Build Go API for the current host
    dir: backend
    cmds: [go build -trimpath -o bin/ ./cmd/api]
  cli:build:
    desc: Build tjucli with its component version
    dir: cli
    vars:
      CLI_VERSION:
        sh: node -p "require('./package.json').version"
    cmds:
      - go build -trimpath -ldflags="-X main.version={{.CLI_VERSION}}" -o bin/ ./cmd/tjucli
      - go build -trimpath -o bin/ ./cmd/tjucli-server
  cli:server:dev:
    desc: Run internal tool server with TJUCLI_GRANTS_FILE configured
    dir: cli
    cmds: [go run ./cmd/tjucli-server]
  cli:test:
    desc: Test the campus CLI and public course provider
    dir: cli
    cmds: [go test -race ./...]
  cli:lint:
    desc: Check the independent CLI module
    dir: cli
    cmds: [go vet ./...]
  crawler:setup:
    desc: Install locked crawler dependencies with Bun
    dir: crawler
    cmds: [bun install --frozen-lockfile]
  crawler:dev:
    desc: Run Bun crawler feed service in watch mode
    dir: crawler
    cmds: [bun run dev]
  crawler:crawl:
    desc: Collect configured real sources once (requires source config and PostgreSQL)
    dir: crawler
    cmds:
      - bun run crawl -- {{.CLI_ARGS}}
  crawler:import:
    desc: Import synthetic events into the configured crawler PostgreSQL database
    dir: crawler
    cmds: [bun run fixture:import]
  crawler:check:
    desc: Typecheck crawler module
    dir: crawler
    cmds: [bun run check]
  crawler:test:
    desc: Run crawler regressions against isolated PostgreSQL (Docker or explicit test URL)
    dir: crawler
    cmds: [bun run test:integration]
  api:test:
    desc: Run Go tests
    dir: backend
    cmds: [go test ./...]
  api:lint:
    desc: Run Go static checks
    dir: backend
    cmds: [go vet ./...]
  api:fmt:
    desc: Format Go code
    dir: backend
    cmds: [go fmt ./...]
  lint:
    desc: Check JS/TS and Go source
    cmds:
      - pnpm lint
      - task: api:lint
      - task: cli:lint
      - task: crawler:check
  types:
    desc: Check client and docs types
    cmds: [pnpm types:check]
  test:
    desc: Test repository tooling and Go API
    cmds:
      - pnpm test:git
      - pnpm test:tooling
      - task: audit:test
      - task: api:test
      - task: cli:test
      - task: crawler:test
      - go test ops/auth/mail_test.go
  check:
    desc: Run portable checks (no native SDK needed)
    cmds:
      - task: lint
      - task: types
      - task: test
      - task: git:check
  build:
    desc: Build Web, docs and API (native builds have separate targets)
    cmds:
      - task: web:build
      - task: docs:build
      - task: api:build
      - task: cli:build
  native:info:
    desc: Inspect Tauri and native SDK requirements
    cmds: [pnpm --dir frontend tauri info]
  native:icons:
    desc: Regenerate platform icons from the source SVG
    cmds: [pnpm --dir frontend tauri icon app-icon.svg]
  native:check:
    desc: Check native Rust code on the current host
    dir: frontend/src-tauri
    cmds: [node ../scripts/native.mjs cargo check --locked]
  native:fmt:
    desc: Format native Rust code
    dir: frontend/src-tauri
    cmds: [node ../scripts/native.mjs cargo fmt]
  desktop:dev:
    desc: Run native desktop development client
    cmds: [pnpm --dir frontend tauri dev]
  linux:build:
    desc: Build Linux amd64 Debian package on Linux
    preconditions:
      - sh: >-
          node -e "process.exit(process.platform === 'linux' ? 0 : 1)"
        msg: This build requires a Linux host.
    cmds: [pnpm --dir frontend tauri build --bundles deb -- --locked]
  windows:build:
    desc: Build unsigned Windows NSIS installer on Windows
    preconditions:
      - sh: >-
          node -e "process.exit(process.platform === 'win32' ? 0 : 1)"
        msg: This build requires a Windows host with MSVC.
    cmds: [pnpm --dir frontend tauri build --bundles nsis -- --locked]
  android:init:
    desc: Generate Android project after installing its SDK/NDK and Rust targets
    cmds: [pnpm --dir frontend tauri android init --ci --skip-targets-install]
    status:
      - test -f frontend/src-tauri/gen/android/gradlew
  android:sdk:
    desc: Install Android SDK packages (review SDK licenses first)
    cmds:
      - '"${SDKMANAGER:-sdkmanager}" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;27.2.12479018"'
  android:licenses:
    desc: Interactively review Android SDK licenses
    interactive: true
    cmds: ['"${SDKMANAGER:-sdkmanager}" --licenses']
  android:targets:
    desc: Install Rust targets used by the generated Android project
    cmds: [node frontend/scripts/native.mjs rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android]
  android:dev:
    desc: Run Android client on a connected device or emulator
    cmds:
      - task: android:init
      - pnpm --dir frontend tauri android dev
  android:build:
    desc: Build installable debug APK for arm64 (not a production signed release)
    cmds:
      - task: android:init
      - pnpm --dir frontend tauri android build --debug --apk --target aarch64 --ci
  compose:config:
    desc: Validate sanitized local Compose configuration
    cmds: [docker compose --env-file ops/compose.env.example config --quiet]
  compose:context:
    desc: Verify the actual Docker build context contains only approved inputs
    cmds: [node scripts/check-docker-context.mjs]
  compose:up:
    desc: Build and start local API and Web containers
    cmds: [docker compose --env-file ops/compose.env.example up --build --detach --wait]
  compose:down:
    desc: Stop local containers without deleting volumes
    cmds: [docker compose --env-file ops/compose.env.example down]
  compose:logs:
    desc: Follow local container logs
    cmds: [docker compose --env-file ops/compose.env.example logs --follow --tail 100]
  compose:ps:
    desc: Show local container status
    cmds: [docker compose --env-file ops/compose.env.example ps]
  compose:smoke:
    desc: Verify running local Web/API containers and their HTTP boundaries
    cmds: [node scripts/smoke-compose.mjs]
  git:setup:
    desc: Install repository Git hooks
    cmds: [pnpm git:setup]
  git:check:
    desc: Check staged paths and whitespace without staging anything
    cmds: [pnpm git:check]
