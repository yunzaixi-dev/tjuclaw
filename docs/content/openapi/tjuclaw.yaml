      tags: [Anki]
      summary: 删除卡片
      operationId: deleteCard
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /reviews:
    get:
      tags: [Anki]
      summary: 查看复习记录
      operationId: listReviews
      responses:
        '200':
          description: 复习记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewListResponse' }
    post:
      tags: [Anki]
      summary: 提交一次复习
      operationId: reviewCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: 更新后的卡片和复习记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewResponse' }
  /media:
    get:
      tags: [Anki]
      summary: 列出 Anki 媒体
      operationId: listAnkiMedia
      responses:
        '200':
          description: 媒体列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaListResponse' }
    post:
      tags: [Anki]
      summary: 上传 Anki 媒体
      operationId: uploadAnkiMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: 媒体已上传, content: { application/json: { schema: { $ref: '#/components/schemas/MediaResponse' } } } }
  /media/{id}:
    get:
      tags: [Anki]
      summary: 下载 Anki 媒体
      operationId: getAnkiMedia
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: 媒体文件, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
    delete:
      tags: [Anki]
      summary: 删除 Anki 媒体
      operationId: deleteAnkiMedia
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /account/model:
    get:
      tags: [Models]
      summary: 获取当前模型配置与配额
      operationId: getModel
      responses:
        '200':
          description: 模型状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
    put:
      tags: [Models]
      summary: 保存自定义模型配置
      operationId: putModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutModelRequest' }
      responses:
        '200':
          description: 配置已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Models]
      summary: 删除自定义模型配置
      operationId: deleteModel
      responses:
        '200':
          description: 已恢复产品模型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }

  /market:
    get:
      tags: [Marketplace]
      summary: 浏览知识库市场
      operationId: listMarket
      responses:
        '200':
          description: 可订阅的公开快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
  /market/{id}/subscribe:
    post:
      tags: [Marketplace]
      summary: 订阅公开知识库
      operationId: subscribePublication
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 订阅成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /publications/{id}/withdraw:
    post:
      tags: [Marketplace]
      summary: 撤回发布快照
      operationId: withdrawPublication
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 撤回成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: tjuclaw_session
      description: 服务端设置的 HttpOnly 浏览器会话 Cookie；生产 HTTPS 下使用 Host-only Cookie。
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: 32 位小写十六进制资源 ID。
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
        example: 0123456789abcdef0123456789abcdef
    FlowId:
      name: id
      in: query
      required: true
      description: Kratos 流程 ID。
      schema: { type: string }
    LogoutToken:
      name: token
      in: query
      required: true
      description: Kratos 返回的一次性登出 token。
      schema: { type: string }
    CampusId:
      name: campusID
      in: path
      required: true
      description: 校区 ID。
      schema: { type: integer, minimum: 1 }
    BuildingId:
      name: buildingID
      in: path
      required: true
      description: 楼宇 ID。
      schema: { type: integer, minimum: 1 }
    RoomId:
      name: roomID
      in: path
      required: true
      description: 自习室 ID。
      schema: { type: integer, minimum: 1 }
    StudyroomSession:
      name: session
      in: query
      required: false
      description: 时段索引；不传或传 -1 时返回楼宇房间概览。
      schema: { type: integer, minimum: -1 }
    RoomDate:
      name: date
      in: query
      required: false
      description: 指定时段时必填，格式为 YYYY-MM-DD。
      schema: { type: string, format: date }
    ForumPage:
      name: page
      in: query
      required: false
      description: 论坛分页页码。
      schema: { type: integer, minimum: 1, default: 1 }
  requestBodies:
    EmptyJson:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false }
          example: {}
    JsonObject:
      required: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonObject' }
    FlowSubmission:
      required: true
      description: 受限代理只允许 JSON 请求，并由上游流程决定具体字段。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FlowSubmission' }
          example:
            method: code
            identifier: user@example.com
            csrf_token: csrf-token
  responses:
    AuthFlow:
      description: 应用认证流程状态
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthFlow' }
    JsonObject:
      description: 上游 JSON 响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonObject' }
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SessionRequired:
      description: 未登录或会话已失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: session_required } }
    OriginRejected:
      description: 请求不是当前应用同源请求
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: origin_rejected } }
    AuthUnavailable:
      description: 认证上游不可用或未配置
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: auth_unavailable } }
    StorageUnavailable:
      description: 对应存储后端不可用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Ok:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OkResponse' }
          example: { error: { id: library_storage_unavailable } }
    UnsupportedMediaType:
      description: 请求必须使用 application/json
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: unsupported_media_type } }
    InvalidQuery:
      description: 查询参数不符合代理白名单
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: invalid_query } }
    NotFound:
      description: 资源不存在、无权访问或路由不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: not_found } }
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [id]
          properties:
            id:
              type: string
              description: 稳定的机器可读错误 ID。
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    IdentitySession:
      type: object
      required: [id, email, email_verified, expires_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        expires_at: { type: string, format: date-time }
    AuthFlow:
      type: object
      required: [stage, captcha_endpoint]
      properties:
        stage: { type: string, enum: [email, code] }
        email: { type: string, format: email }
        expires_at: { type: string, format: date-time }
        resend_at: { type: string, format: date-time }
        captcha_endpoint: { type: string }
    Task:
      type: object
      required: [id, title, prompt, status, created_at]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        title: { type: string, maxLength: 80 }
        prompt: { type: string, minLength: 1, maxLength: 4000 }
        status: { type: string, const: draft }
        created_at: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 4000 }
    TaskResponse:
      type: object
      required: [task]
      properties:
        task: { $ref: '#/components/schemas/Task' }
    TaskListResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
    Run:
      type: object
      required: [id, task_id, owner_id, status, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        task_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        owner_id: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
    RunResponse:
      type: object
      required: [run]
      properties:
        run: { $ref: '#/components/schemas/Run' }
    RunListResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/Run' }
    Library:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        name: { type: string, maxLength: 80 }
        role: { type: string, enum: [owner, subscribed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LibraryResponse:
      type: object
      required: [library]
      properties:
        library: { $ref: '#/components/schemas/Library' }
    LibraryListResponse:
      type: object
      required: [libraries]
      properties:
        libraries:
          type: array
          items: { $ref: '#/components/schemas/Library' }
    NameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    Entry:
      type: object
      required: [id, library_id, parent_id, kind, title, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        library_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        parent_id: { type: string }
        kind: { type: string, enum: [note, agent, work_env, file, folder] }
        preset: { type: string, enum: [guide] }
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 20000 }
        content_type: { type: string }
        size: { type: integer, minimum: 0 }
        sort_order: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EntryResponse:
      type: object
      required: [entry]
      properties:
        entry: { $ref: '#/components/schemas/Entry' }
    EntryListResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
    CreateEntryRequest:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        parent_id: { type: string }
        kind: { type: string, enum: [note, agent, work_env, file, folder] }
        title: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, maxLength: 20000 }
    UpdateEntryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 20000 }
        parent_id: { type: string }
    Publication:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        name: { type: string }
        created_at: { type: string, format: date-time }
        withdrawn: { type: boolean }
    PublicationResponse:
      type: object
      required: [publication]
      properties:
        publication: { $ref: '#/components/schemas/Publication' }
    PublicationListResponse:
      type: object
      required: [publications]
      properties:
        publications:
          type: array
          items: { $ref: '#/components/schemas/Publication' }
    SearchHit:
      type: object
      required: [id, title, snippet, source]
      properties:
        id: { type: string }
        title: { type: string }
        snippet: { type: string }
        source: { type: string }
    SearchResponse:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
    Message:
      type: object
      required: [role, content, created_at]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        tool_call_id: { type: string }
        tool_calls:
          type: array
          items: { $ref: '#/components/schemas/ToolCall' }
        created_at: { type: string, format: date-time }
    ToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id: { type: string }
        name: { type: string }
        arguments: { type: string }
    ChatSession:
      type: object
      required: [id, entry_id, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        entry_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SessionResponse:
      type: object
      required: [session]
      properties:
        session: { $ref: '#/components/schemas/ChatSession' }
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/ChatSession' }
    SandboxTokenResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: 绑定当前用户、会话、条目和 profile 的短期 Bearer token。
        expires_at: { type: string, format: date-time }
        gateway_url:
          type: string
          format: uri
          description: 配置后的沙箱 gateway 公网地址；未配置时省略。
    MessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 8000 }
    Model:
      type: object
      required: [configured, source, name, quota]
      properties:
        configured: { type: boolean }
        source: { type: string, enum: [none, custom, product] }
        name: { type: string }
        quota:
          type: object
          required: [limit, used, remaining]
          properties:
            limit: { type: integer, minimum: 0 }
            used: { type: integer, minimum: 0 }
            remaining: { type: integer, minimum: 0 }
    ModelResponse:
      type: object
      required: [model]
      properties:
        model: { $ref: '#/components/schemas/Model' }
    PutModelRequest:
      type: object
      additionalProperties: false
      required: [base_url, api_key]
      properties:
        base_url: { type: string, format: uri }
        api_key: { type: string, minLength: 1, maxLength: 512 }
        model: { type: string, maxLength: 80 }
    FolderResponse:
      type: object
      required: [folder]
      properties:
        folder: { $ref: '#/components/schemas/Entry' }
    FolderListResponse:
      type: object
      required: [folders]
      properties:
        folders:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        parent_id: { type: string }
    UpdateFolderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, maxLength: 80 }
        parent_id: { type: string }
    MoveEntryRequest:
      type: object
      additionalProperties: false
      required: [parent_id]
      properties:
        parent_id: { type: string }
    ReorderEntriesRequest:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        parent_id: { type: string }
        ids:
          type: array
          minItems: 1
          items: { type: string, pattern: '^[0-9a-f]{32}$' }
    Deck:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 120 }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeckResponse:
      type: object
      required: [deck]
      properties:
        deck: { $ref: '#/components/schemas/Deck' }
    DeckListResponse:
      type: object
      required: [decks]
      properties:
        decks:
          type: array
          items: { $ref: '#/components/schemas/Deck' }
    CreateDeckRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    UpdateDeckRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    AnkiTemplate:
      type: object
      required: [id, name, front, back, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        front: { type: string }
        back: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TemplateResponse:
      type: object
      required: [template]
      properties:
        template: { $ref: '#/components/schemas/AnkiTemplate' }
    TemplateListResponse:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: { $ref: '#/components/schemas/AnkiTemplate' }
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required: [name, front, back]
      properties:
        name: { type: string }
        front: { type: string }
        back: { type: string }
    UpdateTemplateRequest:
      allOf:
        - $ref: '#/components/schemas/CreateTemplateRequest'
    AnkiCard:
      type: object
      required: [id, deck_id, front, back, due, interval, ease, reps, lapses, created_at, updated_at]
      properties:
        id: { type: string }
        deck_id: { type: string }
        template_id: { type: string }
        front: { type: string }
        back: { type: string }
        tags: { type: array, items: { type: string } }
        due: { type: string, format: date-time }
        interval: { type: integer, minimum: 0 }
        ease: { type: integer, minimum: 0 }
        reps: { type: integer, minimum: 0 }
        lapses: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CardResponse:
      type: object
      required: [card]
      properties:
        card: { $ref: '#/components/schemas/AnkiCard' }
    CardListResponse:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items: { $ref: '#/components/schemas/AnkiCard' }
    CreateCardRequest:
      type: object
      additionalProperties: false
      required: [deck_id, front, back]
      properties:
        deck_id: { type: string }
        template_id: { type: string }
        front: { type: string }
        back: { type: string }
        tags: { type: array, items: { type: string } }
    UpdateCardRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        front: { type: string }
        back: { type: string }
        tags: { type: array, items: { type: string } }
    Review:
      type: object
      required: [id, card_id, rating, interval, reviewed_at]
      properties:
        id: { type: string }
        card_id: { type: string }
        rating: { type: integer, minimum: 1, maximum: 4 }
        interval: { type: integer, minimum: 0 }
        reviewed_at: { type: string, format: date-time }
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [card_id, rating]
      properties:
        card_id: { type: string }
        rating: { type: integer, minimum: 1, maximum: 4 }
    ReviewResponse:
      type: object
      required: [card, review]
      properties:
        card: { $ref: '#/components/schemas/AnkiCard' }
        review: { $ref: '#/components/schemas/Review' }
    ReviewListResponse:
      type: object
      required: [reviews]
      properties:
        reviews:
          type: array
          items: { $ref: '#/components/schemas/Review' }
    Media:
      type: object
