      type: object
      required: [id, name, arguments]
      properties:
        id: { type: string }
        name: { type: string }
        arguments: { type: string }
    ChatSession:
      type: object
      required: [id, entry_id, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        entry_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        name: { type: string, maxLength: 60, description: 用户给会话起的名称；未重命名时省略 }
        title: { type: string, maxLength: 60, description: 会话在列表里的标题：有名称时为名称，否则为第一个问题的开头。仅在会话列表中返回（列表不含消息）；两者都没有时省略 }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SessionResponse:
      type: object
      required: [session]
