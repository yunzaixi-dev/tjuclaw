        created_at: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 4000 }
    TaskResponse:
      type: object
      required: [task]
      properties:
        task: { $ref: '#/components/schemas/Task' }
    TaskListResponse:
      type: object
