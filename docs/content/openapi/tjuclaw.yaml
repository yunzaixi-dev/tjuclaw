        session: { $ref: '#/components/schemas/ChatSession' }
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/ChatSession' }
    TurnStep:
      type: object
      required: [kind]
      description: Agent 回复前的一步思考、调用工具前说的话或工具调用，仅会话所有者可见。
      properties:
        kind: { type: string, examples: [thinking, tool] }
        said: { type: boolean, description: 为 true 时，这条 thinking 步骤是模型在调用工具前对用户说的话而不是思考 }
        text: { type: string }
        name: { type: string }
        input: { type: string }
        output: { type: string }
        failed: { type: boolean }
        added: { type: integer, description: 新增的数量：文件写入或编辑为行数；unit 为 char 时为笔记的字符数 }
        removed: { type: integer, description: 删除的数量，单位同 added }
        unit: { type: string, enum: [char], description: 缺省时 added、removed 为行数；char 表示字符数（经知识库工具写入的笔记） }
