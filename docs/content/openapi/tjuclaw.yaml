openapi: 3.1.0
info:
  title: TJUClaw API
  version: 0.0.48
  description: |
    TJUClaw 同源 HTTP API。浏览器通过 Web 端的 `/api` 前缀访问这些接口；
    直接运行 Go API 时，服务根路径就是 API 根路径。

    除健康检查外，业务接口使用 HttpOnly 会话 Cookie。资源归属始终由服务端
    会话身份决定，客户端提交的 owner ID 不参与授权判断。
servers:
  - url: http://127.0.0.1:1420/api
    description: 本地 Web 同源代理
  - url: http://127.0.0.1:8080
    description: 直接访问 Go API
tags:
  - name: System
    description: 服务运行状态
  - name: Authentication
    description: 应用层邮箱验证码、密码与会话接口
  - name: Kratos
    description: 受限的 Ory Kratos 浏览器流程代理
  - name: Tasks
    description: 用户任务
  - name: Runs
    description: 任务运行记录
  - name: Libraries
    description: 知识库、条目与文件
  - name: Sessions
    description: 知识库智能体会话
  - name: Models
    description: 用户模型配置与产品配额
  - name: Marketplace
    description: 知识库发布与订阅
  - name: Campus
    description: 微北洋校园服务代理
  - name: Anki
    description: 服务端牌组、卡片、复习与媒体
security:
  - browserSession: []
paths:
  /healthz:
    get:
      tags: [System]
      summary: 健康检查
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API 正常运行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: { status: ok }

  /auth/flow:
    get:
      tags: [Authentication]
      summary: 读取当前认证流程
      operationId: getAuthFlow
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AuthFlow'
        '403': { $ref: '#/components/responses/OriginRejected' }
  /auth/session:
    get:
      tags: [Authentication]
      summary: 获取当前会话
      operationId: getCurrentSession
      responses:
        '200':
          description: 当前会话有效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/start:
    post:
      tags: [Authentication]
      summary: 发送邮箱验证码
      operationId: startEmailAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAuthRequest' }
            example:
              email: user@example.com
              captcha_token: captcha-token
      responses:
        '200': { $ref: '#/components/responses/AuthFlow' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/verify:
    post:
      tags: [Authentication]
      summary: 校验邮箱验证码并建立会话
      operationId: verifyEmailAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeRequest' }
            example: { code: '123456' }
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/resend:
    post:
      tags: [Authentication]
      summary: 重新发送邮箱验证码
      operationId: resendEmailCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptchaRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthFlow' }
        '403': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/password:
    post:
      tags: [Authentication]
      summary: 使用密码登录
      operationId: passwordLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordAuthRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/register:
    post:
      tags: [Authentication]
      summary: 使用密码注册
      operationId: registerPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordAuthRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthFlow' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/reset:
    post:
      tags: [Authentication]
      summary: 重置当前认证流程
      operationId: resetAuthFlow
      security: []
      requestBody:
        $ref: '#/components/requestBodies/EmptyJson'
      responses:
        '200': { $ref: '#/components/responses/AuthFlow' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: 注销当前会话
      operationId: logout
      requestBody:
        $ref: '#/components/requestBodies/EmptyJson'
      responses:
        '204':
          description: 注销成功
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/captcha/challenge:
    post:
      tags: [Authentication]
      summary: 创建验证码挑战
      operationId: createCaptchaChallenge
      security: []
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          description: 上游验证码服务响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonObject' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/captcha/redeem:
    post:
      tags: [Authentication]
      summary: 兑换验证码挑战
      operationId: redeemCaptcha
      security: []
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          description: 上游验证码服务响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonObject' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /kratos/self-service/login/browser:
    get:
      tags: [Kratos]
      summary: 创建登录浏览器流程
      operationId: createLoginBrowserFlow
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/login/flows:
    get:
      tags: [Kratos]
      summary: 获取登录流程
      operationId: getLoginFlow
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/login:
    post:
      tags: [Kratos]
      summary: 提交登录流程
      operationId: submitLoginFlow
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FlowSubmission'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
  /kratos/self-service/registration/browser:
    get:
      tags: [Kratos]
      summary: 创建注册浏览器流程
      operationId: createRegistrationBrowserFlow
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/registration/flows:
    get:
      tags: [Kratos]
      summary: 获取注册流程
      operationId: getRegistrationFlow
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/registration:
    post:
      tags: [Kratos]
      summary: 提交注册流程
      operationId: submitRegistrationFlow
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FlowSubmission'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/verification/browser:
    get:
      tags: [Kratos]
      summary: 创建邮箱验证流程
      operationId: createVerificationBrowserFlow
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/verification/flows:
    get:
      tags: [Kratos]
      summary: 获取邮箱验证流程
      operationId: getVerificationFlow
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/verification:
    post:
      tags: [Kratos]
      summary: 提交邮箱验证流程
      operationId: submitVerificationFlow
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FlowSubmission'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/logout/browser:
    get:
      tags: [Kratos]
      summary: 创建登出流程
      operationId: createLogoutBrowserFlow
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/OriginRejected' }
  /kratos/self-service/logout:
    get:
      tags: [Kratos]
      summary: 完成登出
      operationId: completeKratosLogout
      parameters:
        - $ref: '#/components/parameters/LogoutToken'
      responses:
        '200':
          description: 上游登出响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonObject' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/OriginRejected' }
  /kratos/self-service/errors:
    get:
      tags: [Kratos]
      summary: 获取认证错误详情
      operationId: getKratosError
      security: []
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/OriginRejected' }

  /tasks:
    get:
      tags: [Tasks]
      summary: 列出当前用户的任务
      operationId: listTasks
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
    post:
      tags: [Tasks]
      summary: 创建任务
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
            example: { prompt: 整理这段课程笔记 }
      responses:
        '201':
          description: 任务创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: 获取任务详情
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /tasks/{id}/runs:
    get:
      tags: [Runs]
      summary: 列出任务运行记录
      operationId: listTaskRuns
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 运行记录列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
    post:
      tags: [Runs]
      summary: 创建任务运行记录
      operationId: createTaskRun
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: 运行记录已排队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /runs/{id}:
    get:
      tags: [Runs]
      summary: 获取运行记录
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 运行记录详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /runs/{id}/cancel:
    post:
      tags: [Runs]
      summary: 取消运行记录
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 运行记录已取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /libraries:
    get:
      tags: [Libraries]
      summary: 列出我的知识库
      operationId: listLibraries
      responses:
        '200':
          description: 知识库列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
    post:
      tags: [Libraries]
      summary: 创建知识库
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
            example: { name: 课程资料 }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '409': { $ref: '#/components/responses/Error' }
  /libraries/{id}:
    get:
      tags: [Libraries]
      summary: 获取知识库
      operationId: getLibrary
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 知识库详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Libraries]
      summary: 重命名知识库
      operationId: renameLibrary
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Libraries]
      summary: 删除知识库
      operationId: deleteLibrary
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /libraries/{id}/entries:
    get:
      tags: [Libraries]
      summary: 列出知识库条目
      operationId: listLibraryEntries
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 条目列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Libraries]
      summary: 创建知识库条目
      operationId: createLibraryEntry
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEntryRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /libraries/{id}/publish:
    post:
      tags: [Marketplace]
      summary: 发布知识库快照
      operationId: publishLibrary
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '201':
          description: 发布成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /libraries/{id}/publications:
    get:
      tags: [Marketplace]
      summary: 列出知识库发布记录
      operationId: listLibraryPublications
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 发布记录列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /libraries/{id}/files:
    post:
      tags: [Libraries]
      summary: 上传知识库文件
      operationId: uploadLibraryFile
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                parent_id:
                  type: string
                  description: 可选的父条目 ID。
      responses:
        '201':
          description: 文件条目创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/Error' }
  /libraries/{id}/search:
    get:
      tags: [Libraries]
      summary: 搜索知识库笔记
      operationId: searchLibraryNotes
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /entries/{id}:
    get:
      tags: [Libraries]
      summary: 获取条目
      operationId: getEntry
