        tool_call_id: { type: string }
        tool_calls:
          type: array
          items: { $ref: '#/components/schemas/ToolCall' }
        tools:
          type: array
          description: 该条 Agent 回复之前调用过的工具名；只含名称，不含参数与结果
          items: { type: string }
        steps:
          type: array
