          type: array
          items: { $ref: '#/components/schemas/Entry' }
    CreateEntryRequest:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        parent_id: { type: string }
        kind: { type: string, enum: [note, agent, work_env, file, folder] }
        title: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, maxLength: 20000 }
    UpdateEntryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 20000 }
        parent_id: { type: string }
        expected_updated_at: { type: string, format: date-time, description: 可选的乐观并发版本，编辑器应始终提供；不同于当前服务端版本返回 409 entry_conflict。 }
    Publication:
      type: object
      required: [id, name, created_at]
