  /libraries/{id}/entries/order:
    put:
      tags: [Libraries]
      summary: 保存同级条目顺序
      operationId: reorderEntries
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderEntriesRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /decks:
    get:
      tags: [Anki]
      summary: 列出牌组
      operationId: listDecks
      responses:
        '200':
          description: 牌组列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeckListResponse' }
    post:
      tags: [Anki]
      summary: 创建牌组
      operationId: createDeck
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeckRequest' }
      responses:
        '201':
          description: 牌组已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeckResponse' }
  /decks/{id}:
    get:
      tags: [Anki]
      summary: 获取牌组
      operationId: getDeck
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: 牌组详情, content: { application/json: { schema: { $ref: '#/components/schemas/DeckResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Anki]
      summary: 修改牌组
      operationId: patchDeck
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDeckRequest' }
      responses:
        '200': { description: 牌组已修改, content: { application/json: { schema: { $ref: '#/components/schemas/DeckResponse' } } } }
    delete:
      tags: [Anki]
      summary: 删除牌组及其卡片
      operationId: deleteDeck
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /decks/{id}/export:
    get:
      tags: [Anki]
      summary: 导出牌组 TSV
      operationId: exportDeck
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: TSV 文件
          content:
            text/tab-separated-values: { schema: { type: string } }
  /decks/{id}/study-summary:
    get:
      tags: [Anki]
      summary: 获取牌组最近学习时间
      description: 仅统计当前账号此牌组中仍存在的卡片，返回单条摘要而非完整复习历史。
      operationId: getDeckStudySummary
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 牌组学习摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeckStudySummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /decks/import:
    post:
      tags: [Anki]
      summary: 导入 TSV 牌组
      operationId: importDeck
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportDeckRequest' }
      responses:
        '201':
          description: 导入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportDeckResponse' }
  /templates:
    get:
      tags: [Anki]
      summary: 列出卡片模板
      operationId: listAnkiTemplates
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateListResponse' }
    post:
      tags: [Anki]
      summary: 创建卡片模板
      operationId: createAnkiTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplateRequest' }
      responses:
        '201': { description: 模板已创建, content: { application/json: { schema: { $ref: '#/components/schemas/TemplateResponse' } } } }
  /templates/{id}:
    get:
      tags: [Anki]
      summary: 获取卡片模板
      operationId: getAnkiTemplate
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: 模板详情, content: { application/json: { schema: { $ref: '#/components/schemas/TemplateResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Anki]
      summary: 修改卡片模板
      operationId: patchAnkiTemplate
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTemplateRequest' }
      responses:
        '200': { description: 模板已修改, content: { application/json: { schema: { $ref: '#/components/schemas/TemplateResponse' } } } }
    delete:
      tags: [Anki]
      summary: 删除卡片模板
      operationId: deleteAnkiTemplate
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /cards:
    get:
      tags: [Anki]
      summary: 列出卡片
      operationId: listCards
      parameters:
        - name: deck_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 卡片列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardListResponse' }
    post:
      tags: [Anki]
      summary: 创建卡片
      operationId: createCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCardRequest' }
      responses:
        '201': { description: 卡片已创建, content: { application/json: { schema: { $ref: '#/components/schemas/CardResponse' } } } }
  /cards/{id}:
    get:
      tags: [Anki]
      summary: 获取卡片
      operationId: getCard
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: 卡片详情, content: { application/json: { schema: { $ref: '#/components/schemas/CardResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Anki]
      summary: 修改卡片
      operationId: patchCard
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCardRequest' }
      responses:
        '200': { description: 卡片已修改, content: { application/json: { schema: { $ref: '#/components/schemas/CardResponse' } } } }
    delete:
      tags: [Anki]
      summary: 删除卡片
      operationId: deleteCard
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /reviews:
    get:
      tags: [Anki]
      summary: 查看复习记录
      operationId: listReviews
      responses:
        '200':
          description: 复习记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewListResponse' }
    post:
      tags: [Anki]
      summary: 提交一次复习
      operationId: reviewCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: 更新后的卡片和复习记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewResponse' }
  /reviews/requests/{id}:
    get:
      tags: [Anki]
      summary: 按客户端请求编号确认复习是否已提交
      description: 用于网络中断后对账，不可仅根据卡片复习次数变化判断本次请求是否成功。仅返回当前账号的记录。
      operationId: getReviewRequest
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      responses:
        '200':
          description: 请求已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewLookupResponse' }
        '404': { description: 当前账号尚无此请求的复习记录 }
  /media:
    get:
      tags: [Anki]
      summary: 列出 Anki 媒体
      operationId: listAnkiMedia
      responses:
        '200':
          description: 媒体列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaListResponse' }
    post:
      tags: [Anki]
      summary: 上传 Anki 媒体
      operationId: uploadAnkiMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: 媒体已上传, content: { application/json: { schema: { $ref: '#/components/schemas/MediaResponse' } } } }
  /media/{id}:
    get:
      tags: [Anki]
      summary: 下载 Anki 媒体
      operationId: getAnkiMedia
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: 媒体文件, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
    delete:
      tags: [Anki]
      summary: 删除 Anki 媒体
      operationId: deleteAnkiMedia
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /media/image:
    get:
      tags: [Models]
      summary: 代理读取公开校园图床的原图
      description: 仅限已登录用户；只转发白名单主机（MEDIA_IMAGE_HOSTS）上的 https 图片，响应为 image/*，不跟随到白名单外的跳转。
      operationId: getMediaImage
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        '200':
          description: 原图
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '502': { $ref: '#/components/responses/Error' }
  /account/model:
    get:
      tags: [Models]
      summary: 获取当前模型配置与配额
      description: 沙箱会话的额度按 UTC 日统计模型请求次数，而非会话消息轮数；额度源不可用时返回 503，不提供过期计数。
      operationId: getModel
      responses:
        '200':
          description: 模型状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [Models]
      summary: 保存自定义模型或选择产品模型
      operationId: putModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutModelRequest' }
      responses:
        '200':
          description: 配置已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Models]
      summary: 删除自定义模型配置
      operationId: deleteModel
      responses:
        '200':
          description: 已恢复产品模型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }

  /account/skills:
    get:
      tags: [Skills]
      summary: 列出精选技能及是否启用
      operationId: listSkills
      responses:
        '200':
          description: 技能目录
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills:
                    type: array
                    items:
                      type: object
                      required: [id, title, summary, description, enabled]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        summary: { type: string }
                        description: { type: string }
                        enabled: { type: boolean }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '503': { $ref: '#/components/responses/Error' }
  /account/skills/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Skills]
      summary: 启用或停用一个技能
      operationId: setSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: 已更新 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/Error' }
  /account/mcp:
    get:
      tags: [MCP]
      summary: 列出精选目录与已添加的 MCP 服务
      description: 精选目录不含服务地址；已添加的服务只返回是否设置了密钥，从不返回密钥。
      operationId: listMCP
      responses:
        '200':
          description: 目录与已添加的服务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      tags: [MCP]
      summary: 从精选目录或按地址添加 MCP 服务
      description: >-
        目录服务只需 `catalog_id`（需要密钥时附 `secret`）。自定义服务需公网 HTTPS 的
        Streamable HTTP 地址、工具前缀 `name` 与认证方式。每个账号最多 12 个服务。
      operationId: addMCP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMCPRequest' }
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServerResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '409': { $ref: '#/components/responses/Error' }
  /account/mcp/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
    patch:
      tags: [MCP]
      summary: 启用、停用或更换密钥
      operationId: updateMCP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                secret: { type: string, maxLength: 1024, description: 空字符串清除可选密钥；必需密钥不能清除。 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServerResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [MCP]
      summary: 移除 MCP 服务
      operationId: deleteMCP
      responses:
        '204': { description: 已移除 }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/Error' }
  /account/mcp/{id}/check:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
    post:
      tags: [MCP]
      summary: 立即连接服务并列出其工具
      description: 失败时 `error.id` 为 `mcp_unauthorized`、`mcp_unavailable`、`mcp_protocol` 或 `upstream_blocked`。
      operationId: checkMCP
      responses:
        '200':
          description: 服务提供的工具
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      required: [name, description]
                      properties:
                        name: { type: string }
                        description: { type: string }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /market:
    get:
      tags: [Marketplace]
      summary: 浏览知识库市场
      operationId: listMarket
      responses:
        '200':
          description: 可订阅的公开快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
  /market/{id}/subscribe:
    post:
      tags: [Marketplace]
      summary: 订阅公开知识库
      operationId: subscribePublication
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 订阅成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /publications/{id}/withdraw:
    post:
      tags: [Marketplace]
      summary: 撤回发布快照
      operationId: withdrawPublication
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 撤回成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /release-notes:
    get:
      tags: [ReleaseNotes]
      summary: 列出最近的更新日志条目
      description: |
        读取配置的更新日志 RSS 源，按实际上线时间倒序返回最新 20 条。
        未配置或源不可用时返回 503；源短暂不可用时仍可返回上一次成功的列表。
      operationId: listReleaseNotes
      security: []
      responses:
        '200':
          description: 更新日志条目
          headers:
            Cache-Control:
              description: 成功响应可缓存 60 秒。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseNotesResponse'
        '503':
          description: 更新日志源不可用或未配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: { id: release_notes_unavailable } }

components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: tjuclaw_session
      description: 服务端设置的 HttpOnly 浏览器会话 Cookie；生产 HTTPS 下使用 Host-only Cookie。
    localRuntime:
      type: http
      scheme: bearer
      description: POST /sandbox/local/runtime 签发的本地沙箱运行时授权。
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: 32 位小写十六进制资源 ID。
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
        example: 0123456789abcdef0123456789abcdef
    FlowId:
      name: id
      in: query
      required: true
      description: Kratos 流程 ID。
      schema: { type: string }
    LogoutToken:
      name: token
      in: query
      required: true
      description: Kratos 返回的一次性登出 token。
      schema: { type: string }
    CampusId:
      name: campusID
      in: path
      required: true
      description: 校区 ID。
      schema: { type: integer, minimum: 1 }
    BuildingId:
      name: buildingID
      in: path
      required: true
      description: 楼宇 ID。
      schema: { type: integer, minimum: 1 }
    RoomId:
      name: roomID
      in: path
      required: true
      description: 自习室 ID。
      schema: { type: integer, minimum: 1 }
    StudyroomSession:
      name: session
      in: query
      required: false
      description: 时段索引；不传或传 -1 时返回楼宇房间概览。
      schema: { type: integer, minimum: -1 }
    RoomDate:
      name: date
      in: query
      required: false
      description: 指定时段时必填，格式为 YYYY-MM-DD。
      schema: { type: string, format: date }
    ForumPage:
      name: page
      in: query
      required: false
      description: 论坛分页页码。
      schema: { type: integer, minimum: 1, default: 1 }
    ToolGrant:
      name: X-TJUClaw-Tool-Grant
      in: header
      required: true
      description: 回合进行中服务端签发的 64 位十六进制工具授权。
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    ToolOwner:
      name: X-TJUClaw-Owner
      in: header
      required: true
      description: 授权所属用户 ID，必须与授权一致。
      schema: { type: string }
    ToolSession:
      name: X-TJUClaw-Session
      in: header
      required: true
      description: 授权所属会话 ID，必须与授权一致。
      schema: { type: string, pattern: '^[0-9a-f]{32}$' }
  requestBodies:
    EmptyJson:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false }
          example: {}
    JsonObject:
      required: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonObject' }
    FlowSubmission:
      required: true
      description: 受限代理只允许 JSON 请求，并由上游流程决定具体字段。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FlowSubmission' }
          example:
            method: code
            identifier: user@example.com
            csrf_token: csrf-token
  responses:
    AuthFlow:
      description: 应用认证流程状态
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthFlow' }
    JsonObject:
      description: 上游 JSON 响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonObject' }
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SessionRequired:
      description: 未登录或会话已失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: session_required } }
    OriginRejected:
      description: 请求不是当前应用同源请求
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: origin_rejected } }
    AuthUnavailable:
      description: 认证上游不可用或未配置
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: auth_unavailable } }
    StorageUnavailable:
      description: 对应存储后端不可用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Ok:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OkResponse' }
          example: { error: { id: library_storage_unavailable } }
    UnsupportedMediaType:
      description: 请求必须使用 application/json
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: unsupported_media_type } }
    InvalidQuery:
      description: 查询参数不符合代理白名单
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: invalid_query } }
    NotFound:
      description: 资源不存在、无权访问或路由不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { id: not_found } }
  schemas:
    ReleaseNote:
      type: object
      additionalProperties: false
      required: [title, published_at, tags]
      properties:
        title:
          type: string
          description: 更新日志标题，超过 200 个字符会截断。
        published_at:
          type: string
          format: date-time
          description: 该条更新实际上线的时间。
        tags:
          type: array
          maxItems: 8
          items: { type: string }
    ReleaseNotesResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ReleaseNote' }
    SealedObject:
      type: object
      additionalProperties: false
      required: [version, salt, nonce, ciphertext]
      properties:
        version: { type: integer, const: 1 }
        salt:
          type: string
          description: 16 字节盐，base64url 无填充编码
        nonce:
          type: string
          description: 12 字节随机数，base64url 无填充编码
        ciphertext:
          type: string
          description: 16 至 98304 字节密文，base64url 无填充编码
    JsonObject:
      type: object
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [id]
          properties:
            id:
              type: string
              description: 稳定的机器可读错误 ID。
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    IdentitySession:
      type: object
      required: [id, email, email_verified, expires_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        expires_at: { type: string, format: date-time }
    AuthFlow:
      type: object
