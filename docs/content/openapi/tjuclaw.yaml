openapi: 3.1.0
info:
  title: TJUClaw API
  version: 0.0.48
  description: |
    TJUClaw 同源 HTTP API。浏览器通过 Web 端的 `/api` 前缀访问这些接口；
    直接运行 Go API 时，服务根路径就是 API 根路径。

    除健康检查外，业务接口使用 HttpOnly 会话 Cookie。资源归属始终由服务端
    会话身份决定，客户端提交的 owner ID 不参与授权判断。
servers:
  - url: http://127.0.0.1:1420/api
    description: 本地 Web 同源代理
  - url: http://127.0.0.1:8080
    description: 直接访问 Go API
tags:
  - name: System
    description: 服务运行状态
  - name: ReleaseNotes
    description: 客户端更新提示使用的更新日志条目
  - name: Authentication
    description: 应用层邮箱验证码、密码与会话接口
  - name: Kratos
    description: 受限的 Ory Kratos 浏览器流程代理
  - name: Tasks
    description: 用户任务
  - name: Runs
    description: 任务运行记录
  - name: Libraries
    description: 知识库、条目与文件
  - name: Sessions
    description: 知识库智能体会话
  - name: Vault
    description: 用户 Forgejo 仓库中的不透明密封对象传输；尚未替换现有笔记存储
  - name: Models
    description: 用户模型配置与产品配额
  - name: Skills
    description: 精选技能插件；启用后 Agent 通过 read_skill 读取其做法
  - name: MCP
    description: 用户添加的远程 MCP 服务；其工具与产品工具一起提供给 Agent
  - name: Marketplace
    description: 知识库发布与订阅
  - name: Campus
    description: 微北洋校园服务代理
  - name: Anki
    description: 服务端牌组、卡片、复习与媒体
security:
  - browserSession: []
paths:
  /healthz:
    get:
      tags: [System]
      summary: 健康检查
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API 正常运行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: { status: ok }

  /auth/flow:
    get:
      tags: [Authentication]
      summary: 读取当前认证流程
      operationId: getAuthFlow
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AuthFlow'
        '403': { $ref: '#/components/responses/OriginRejected' }
  /auth/session:
    get:
      tags: [Authentication]
      summary: 获取当前会话
      operationId: getCurrentSession
      responses:
        '200':
          description: 当前会话有效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/start:
    post:
      tags: [Authentication]
      summary: 发送邮箱验证码
      operationId: startEmailAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAuthRequest' }
            example:
              email: user@example.com
              captcha_token: captcha-token
      responses:
        '200': { $ref: '#/components/responses/AuthFlow' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/verify:
    post:
      tags: [Authentication]
      summary: 校验邮箱验证码并建立会话
      operationId: verifyEmailAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeRequest' }
            example: { code: '123456' }
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/resend:
    post:
      tags: [Authentication]
      summary: 重新发送邮箱验证码
      operationId: resendEmailCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptchaRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthFlow' }
        '403': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/password:
    post:
      tags: [Authentication]
      summary: 使用密码登录
      operationId: passwordLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordAuthRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySession' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/register:
    post:
      tags: [Authentication]
      summary: 使用密码注册
      operationId: registerPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordAuthRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthFlow' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/reset:
    post:
      tags: [Authentication]
      summary: 重置当前认证流程
      operationId: resetAuthFlow
      security: []
      requestBody:
        $ref: '#/components/requestBodies/EmptyJson'
      responses:
        '200': { $ref: '#/components/responses/AuthFlow' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: 注销当前会话
      operationId: logout
      requestBody:
        $ref: '#/components/requestBodies/EmptyJson'
      responses:
        '204':
          description: 注销成功
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/captcha/challenge:
    post:
      tags: [Authentication]
      summary: 创建验证码挑战
      operationId: createCaptchaChallenge
      security: []
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          description: 上游验证码服务响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonObject' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/captcha/redeem:
    post:
      tags: [Authentication]
      summary: 兑换验证码挑战
      operationId: redeemCaptcha
      security: []
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          description: 上游验证码服务响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonObject' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /kratos/self-service/login/browser:
    get:
      tags: [Kratos]
      summary: 创建登录浏览器流程
      operationId: createLoginBrowserFlow
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/login/flows:
    get:
      tags: [Kratos]
      summary: 获取登录流程
      operationId: getLoginFlow
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/login:
    post:
      tags: [Kratos]
      summary: 提交登录流程
      operationId: submitLoginFlow
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FlowSubmission'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
  /kratos/self-service/registration/browser:
    get:
      tags: [Kratos]
      summary: 创建注册浏览器流程
      operationId: createRegistrationBrowserFlow
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/registration/flows:
    get:
      tags: [Kratos]
      summary: 获取注册流程
      operationId: getRegistrationFlow
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/registration:
    post:
      tags: [Kratos]
      summary: 提交注册流程
      operationId: submitRegistrationFlow
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FlowSubmission'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/verification/browser:
    get:
      tags: [Kratos]
      summary: 创建邮箱验证流程
      operationId: createVerificationBrowserFlow
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/verification/flows:
    get:
      tags: [Kratos]
      summary: 获取邮箱验证流程
      operationId: getVerificationFlow
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/verification:
    post:
      tags: [Kratos]
      summary: 提交邮箱验证流程
      operationId: submitVerificationFlow
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FlowSubmission'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kratos/self-service/logout/browser:
    get:
      tags: [Kratos]
      summary: 创建登出流程
      operationId: createLogoutBrowserFlow
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/OriginRejected' }
  /kratos/self-service/logout:
    get:
      tags: [Kratos]
      summary: 完成登出
      operationId: completeKratosLogout
      parameters:
        - $ref: '#/components/parameters/LogoutToken'
      responses:
        '200':
          description: 上游登出响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonObject' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/OriginRejected' }
  /kratos/self-service/errors:
    get:
      tags: [Kratos]
      summary: 获取认证错误详情
      operationId: getKratosError
      security: []
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/OriginRejected' }

  /tasks:
    get:
      tags: [Tasks]
      summary: 列出当前用户的任务
      operationId: listTasks
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
    post:
      tags: [Tasks]
      summary: 创建任务
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
            example: { prompt: 整理这段课程笔记 }
      responses:
        '201':
          description: 任务创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: 获取任务详情
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /tasks/{id}/runs:
    get:
      tags: [Runs]
      summary: 列出任务运行记录
      operationId: listTaskRuns
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 运行记录列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
    post:
      tags: [Runs]
      summary: 创建任务运行记录
      operationId: createTaskRun
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: 运行记录已排队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /runs/{id}:
    get:
      tags: [Runs]
      summary: 获取运行记录
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 运行记录详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /runs/{id}/cancel:
    post:
      tags: [Runs]
      summary: 取消运行记录
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 运行记录已取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /libraries:
    get:
      tags: [Libraries]
      summary: 列出我的知识库
      operationId: listLibraries
      responses:
        '200':
          description: 知识库列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
    post:
      tags: [Libraries]
      summary: 创建知识库
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
            example: { name: 课程资料 }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '409': { $ref: '#/components/responses/Error' }
  /libraries/{id}:
    get:
      tags: [Libraries]
      summary: 获取知识库
      operationId: getLibrary
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 知识库详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Libraries]
      summary: 重命名知识库
      operationId: renameLibrary
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Libraries]
      summary: 删除知识库
      operationId: deleteLibrary
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /libraries/{id}/entries:
    get:
      tags: [Libraries]
      summary: 列出知识库条目
      operationId: listLibraryEntries
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 条目列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Libraries]
      summary: 创建知识库条目
      operationId: createLibraryEntry
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEntryRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /libraries/{id}/publish:
    post:
      tags: [Marketplace]
      summary: 发布知识库快照
      operationId: publishLibrary
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '201':
          description: 发布成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /libraries/{id}/publications:
    get:
      tags: [Marketplace]
      summary: 列出知识库发布记录
      operationId: listLibraryPublications
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 发布记录列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /libraries/{id}/files:
    post:
      tags: [Libraries]
      summary: 上传知识库文件
      operationId: uploadLibraryFile
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                parent_id:
                  type: string
                  description: 可选的同库父文件夹 ID；普通笔记或文件不能作为父级。
      responses:
        '201':
          description: 文件条目创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/Error' }
  /libraries/{id}/search:
    get:
      tags: [Libraries]
      summary: 搜索知识库笔记
      operationId: searchLibraryNotes
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /library/git:
    get:
      tags: [Libraries]
      summary: 读取知识库 Git 镜像状态
      description: 返回当前用户笔记镜像到 Git 仓库的同步状态；首次读取会启动该用户的镜像。未启用镜像时返回 enabled=false。
      operationId: getLibraryGit
      responses:
        '200':
          description: 镜像状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryGitResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }

  /entries/{id}/history:
    get:
      tags: [Libraries]
      summary: 笔记历史版本
      description: 不带 revision 时返回该笔记最近 30 次提交；带 40 位提交 SHA 时返回该版本的笔记内容。仅笔记条目有历史；未启用镜像返回 404 history_unavailable。
      operationId: getEntryHistory
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - name: revision
          in: query
          required: false
          description: 40 位小写十六进制提交 SHA。
          schema: { type: string, pattern: '^[0-9a-f]{40}$' }
      responses:
        '200':
          description: 提交列表或指定版本内容
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/EntryHistoryResponse' }
                  - { $ref: '#/components/schemas/EntryRevisionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Error' }

  /entries/{id}:
    get:
      tags: [Libraries]
      summary: 获取条目
      operationId: getEntry
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 条目详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Libraries]
      summary: 更新条目
      description: 修改笔记、富文本或文件标题必须发送上次读取的 updated_at 作为 expected_updated_at；缺少版本返回 428 entry_revision_required，版本过期返回 409 entry_conflict，服务器不会覆盖其他设备的修改。
      operationId: updateEntry
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEntryRequest' }
      responses:
        '200':
          description: 更新后的条目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Libraries]
      summary: 删除条目
      operationId: deleteEntry
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /entries/{id}/file:
    get:
      tags: [Libraries]
      summary: 下载条目文件
      operationId: downloadEntryFile
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 文件二进制内容
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /entries/{id}/sessions:
    get:
      tags: [Sessions]
      summary: 列出条目的智能体会话
      operationId: listEntrySessions
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Sessions]
      summary: 创建智能体会话
      operationId: createEntrySession
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '201':
          description: 会话创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions/{id}:
    get:
      tags: [Sessions]
      summary: 获取智能体会话
      operationId: getSession
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sessions]
      summary: 重命名智能体会话
      description: |
        需要登录。设置会话的名称，名称会作为会话列表里的标题。空白名称清除自定义名称，
        标题恢复为第一个问题的开头。重命名不改变会话的更新时间。其他用户的或不存在的会话返回 404。
      operationId: renameSession
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 60, description: 新名称；首尾空白与连续空白会被整理 }
      responses:
        '200':
          description: 已重命名
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, pattern: '^[0-9a-f]{32}$' }
                  name: { type: string, description: 整理后的名称；为空表示已清除 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Sessions]
      summary: 删除智能体会话
      description: |
        需要登录。删除会话及其全部消息，不可恢复。会话里仍在进行的回合失去保存位置，不会产生回复。
        其他用户的或不存在的会话返回 404。
      operationId: deleteSession
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '204':
          description: 已删除
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions/{id}/live:
    get:
      tags: [Sessions]
      summary: 获取当前回合的实时时间线
      description: |
        需要登录。返回当前用户在本 API 进程内记录的回合时间线 `items`：按发生顺序排列的思考、
        模型说的话和工具调用。工具调用从参数开始写入（`writing`）到执行（`running`）再到结束
        （`done` 或 `failed`）都在同一条目上更新；写文件时 `lines` 是已写入的行数，
        结束后 `added`、`removed` 是改动的行数。带 `version` 时最长等待 15 秒，直到回合状态与该版本
        不同才返回，客户端由此无需定时轮询。同时带 `tail` 与 `at` 时只返回该版本之后变化的条目，
        且 `tail` 指向的条目只返回 `at` 字节之后的文本；偏移无效时该条目从头返回。
        `steps` 与 `stream` 是时间线之前的形状（工具调用列表，以及当前这次模型调用的思考与正文），
        为尚未更新的客户端保留；带 `call`、`thinking`、`text` 时 `stream` 只返回尚未拿到的部分。
        空闲、缺失或其他用户的合法会话 ID 均返回空回合；无效 ID 返回 404。
        回合结束后清除，不替代已保存的会话记录。
      operationId: getSessionLiveSteps
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { name: version, in: query, schema: { type: integer, minimum: 0 }, description: 客户端已有的版本；提供时等待变化 }
        - { name: call, in: query, schema: { type: string }, description: 客户端已有输出所属的模型调用 }
        - { name: thinking, in: query, schema: { type: integer, minimum: 0 }, description: 上次响应的 thinking_next }
        - { name: text, in: query, schema: { type: integer, minimum: 0 }, description: 上次响应的 text_next }
        - { name: tail, in: query, schema: { type: integer, minimum: 0 }, description: 客户端仍在接收文本的时间线条目序号；提供时只返回 version 之后变化的条目 }
        - { name: at, in: query, schema: { type: integer, minimum: 0 }, description: 该条目上次响应的 next }
      responses:
        '200':
          description: 当前回合的时间线
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [version, steps, stream, items, count, rate]
                properties:
                  version: { type: integer, description: 回合状态版本；空闲为 0 }
                  count: { type: integer, description: 时间线的条目总数 }
                  items:
                    type: array
                    description: 时间线条目；首次读取返回全部，之后只返回变化的条目
                    items:
                      type: object
                      required: [i, kind]
                      properties:
                        i: { type: integer, description: 条目在时间线中的序号 }
                        kind: { type: string, enum: [thinking, text, tool] }
                        text: { type: string, description: 思考或正文，自 from 字节起 }
                        from: { type: integer }
                        next: { type: integer, description: 文本的字节长度，作为下次请求的 at }
                        name: { type: string }
                        input: { type: string }
                        status: { type: string, enum: [writing, running, done, failed] }
                        lines: { type: integer, description: 文件写入过程中已写入的行数 }
                        added: { type: integer }
                        removed: { type: integer }
                        unit: { type: string, enum: [char], description: 缺省为行数；char 表示 added、removed 为字符数 }
                        output: { type: string, description: 工具结果的摘录 }
                  rate:
                    type: object
                    required: [tokens, ms]
                    description: 当前这次模型调用已输出的估算 token 数及其用时，用于显示输出速度
                    properties:
                      tokens: { type: integer }
                      ms: { type: integer }
                  steps:
                    type: array
                    items:
                      type: object
                      required: [name, status]
                      properties:
                        name: { type: string }
                        input: { type: string }
                        status: { type: string, enum: [running, done, failed] }
                  stream:
                    type: object
                    required: [call, thinking, thinking_from, thinking_next, text, text_from, text_next]
                    properties:
                      call: { type: string, description: 当前模型调用的序号；新的调用会重置思考与正文 }
                      thinking: { type: string }
                      thinking_from: { type: integer }
                      thinking_next: { type: integer }
                      text: { type: string }
                      text_from: { type: integer }
                      text_next: { type: integer }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions/{id}/prepare:
    post:
      tags: [Sessions]
      summary: 预热会话的沙箱
      description: |
        需要登录。用户开始输入时调用：在后台创建或校验该会话的沙箱与检出，使第一条消息不必等待沙箱启动。
        立即返回；每个会话每 5 分钟最多预热一次。未启用沙箱时返回 204。其他用户的或不存在的会话返回 404。
      operationId: prepareSession
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '202':
          description: 已接受，预热在后台进行或刚进行过
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        '204': { description: 未启用沙箱，无需预热 }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions/{id}/interrupt:
    post:
      tags: [Sessions]
      summary: 停止会话正在进行的这一轮
      description: |
        需要登录。请求沙箱网关让当前这一轮尽快收尾：模型正在输出文字时停在当前位置，
        正在执行的工具会先执行完。等待中的发送消息请求仍会正常返回这一轮的回复，
        该回复带有 interrupted 标记。没有正在进行的一轮时返回 409；
        未启用沙箱网关或网关不可达时返回 503，这一轮会继续运行。
        其他用户的或不存在的会话返回 404。
      operationId: interruptSession
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '202':
          description: 已请求停止
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [interrupted]
                properties:
                  interrupted: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /vault/status:
    get:
      tags: [Vault]
      summary: 查询当前密封对象通道的配置状态
      description: |
        需要登录；configured 为 false 仅表示未配置远端通道或网关明确
        报告未启用。网关不可达或返回无效状态时返回 503，客户端不得
        降级为本地口令验证。此状态不表示笔记正文已加密。
      operationId: getVaultStatus
      responses:
        '200':
          description: 通道配置状态
          content:
            application/json:
              schema:
                type: object
                required: [configured]
                properties:
                  configured: { type: boolean }
                additionalProperties: false
        '401': { $ref: '#/components/responses/SessionRequired' }
        '503': { $ref: '#/components/responses/Error' }
  /vault/objects/{id}:
    get:
      tags: [Vault]
      summary: 读取当前用户仓库中的密封对象
      description: |
        从当前登录用户的私有 Forgejo 仓库读取固定路径的对象。API 不解密对象。
        ETag 是仓库内容版本（Git blob SHA），用于后续条件写入。当前笔记
        CRUD 仍使用原存储，不能把此端点视为笔记已完成端到端加密。
      operationId: getVaultObject
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 密封对象及其当前 ETag
          headers:
            ETag:
              description: 带引号的 40 位小写 Git blob SHA
              schema: { type: string, pattern: '^"[0-9a-f]{40}"$' }
          content:
            application/vnd.tjuclaw.sealed+json:
              schema: { $ref: '#/components/schemas/SealedObject' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [Vault]
      summary: 条件写入当前用户仓库中的密封对象
      description: |
        创建时发送 If-None-Match: *；更新时发送上次读取到的 If-Match ETag。
        竞争更新返回 409，客户端需重新读取并自行处理冲突。对象格式校验
        不等于服务端能够证明客户端提交的内容确实经过加密。
      operationId: putVaultObject
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: If-Match
          in: header
          description: 更新已有对象时必填，带引号的 Git blob SHA；不可与 If-None-Match 同用
          schema: { type: string, pattern: '^"[0-9a-f]{40}"$' }
        - name: If-None-Match
          in: header
          description: 仅创建新对象时设置为 *
          schema: { type: string, const: '*' }
      requestBody:
        required: true
        content:
          application/vnd.tjuclaw.sealed+json:
            schema: { $ref: '#/components/schemas/SealedObject' }
      responses:
        '200':
          description: 对象已更新
          headers:
            ETag:
              schema: { type: string, pattern: '^"[0-9a-f]{40}"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '201':
          description: 对象已创建
          headers:
            ETag:
              schema: { type: string, pattern: '^"[0-9a-f]{40}"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Vault]
      summary: 根据 ETag 条件删除当前用户仓库中的密封对象
      description: |
        必须发送上次读取到的 If-Match ETag；过期版本返回 409，缺失对象返回 404。
        删除只改变当前仓库树，不清除 Git 历史。笔记 CRUD 尚未使用此端点。
      operationId: deleteVaultObject
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[0-9a-f]{40}"$' }
      responses:
        '204': { description: 当前版本已删除 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sessions/{id}/sandbox-token:
    post:
      tags: [Sessions]
      summary: 获取会话的短期沙箱访问令牌
      description: >-
        网关的 POST /v1/sessions/note 在已授权且验证过的 Git 提交中找不到笔记时返回 404 note_not_found；沙箱或仓库读取故障返回 503 sandbox_unavailable，不能把后者当作笔记已删除。
        仅会话所属用户可签发。必须配置合法的 HTTPS 公开网关 origin 和 HMAC 密钥，否则返回 503 sandbox_not_configured，不签发令牌。返回 v2/workspace 范围的短期令牌，只允许访问网关的 notes、note、note/move、search、graph 接口，不能调用 ensure 或 message 执行 Agent；后端执行会话仍单独签发 v1 令牌。浏览器使用返回的 gateway_url 直连沙箱的 POST /v1/sessions/notes 和 POST /v1/sessions/note 读取该会话绑定仓库 HEAD 中的普通 Markdown；POST /v1/sessions/search 在沙箱侧检索已提交 Markdown，返回至多 20 条路径和短摘录；POST /v1/sessions/graph 从已提交 Markdown 计算至多 200 个节点、512 条有向双链，客户端据此显示反向链接。查询和结果不经过后端。列表和图谱返回 revision。PUT /v1/sessions/note 携带列表的 expected_revision 和正文在根目录或普通嵌套目录新建不存在的 Markdown；POST /v1/sessions/note/move 携带 path、destination 和 expected_revision 重命名/移动已提交笔记，不覆盖目标，Git 不追踪空目录且不会重写双链；PATCH /v1/sessions/note 携带 expected_revision 和正文做条件写入；DELETE /v1/sessions/note 携带 path 和 expected_revision 从当前 Git 提交移除文件（历史版本仍可通过 Git 恢复），过期版本返回 409。正文不经过后端转发；令牌仅存内存，禁止写入持久存储。沙箱文件与旧知识库笔记尚未合并；EdgeOne、网关与 Forgejo 仍可看到明文，此接口不代表端到端加密。
      operationId: issueSandboxToken
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 短期沙箱访问令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxTokenResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Error' }
  /sessions/{id}/messages:
    post:
      tags: [Sessions]
      summary: 向智能体会话发送消息
      description: 同一轮网络重试应沿用 client_request_id；已完成的请求直接返回已保存的会话，不再次执行 Agent。跨副本并发写入使用会话版本校验，过期写入返回 409 session_conflict，客户端应读取最新会话并保留未确认的草稿。启用沙箱网关时，在启动 Pi 前读取 Broker 共享模型请求配额；已耗尽返回 429 quota_exceeded，账本不可用返回 503 quota_unavailable。此预检不能代替 Broker 原子限额，额度按模型请求而非会话回合计数。
      operationId: postSessionMessage
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageRequest' }
            example: { content: 总结这篇笔记 }
      responses:
        '200':
          description: 更新后的会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /sessions/{id}/local-turns:
    post:
      tags: [Sessions]
      summary: 开启桌面端本地沙箱回合
      description: 桌面客户端在本机 Docker 沙箱中运行 Agent 前调用。服务端校验会话归属与产品配额，签发 5 分钟有效的工具授权，本地 Broker 凭该授权回调沙箱工具接口。配额已耗尽返回 429 quota_<window>_exceeded。
      operationId: beginLocalTurn
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: 本地回合授权
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalTurnResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /sessions/{id}/local-turns/finish:
    post:
      tags: [Sessions]
      summary: 结束本地沙箱回合并保存记录
      description: 保存本地回合的用户消息、Agent 回复与思考/工具步骤，并计入一次产品用量。授权只能使用一次；已过期或已结束返回 409 local_turn_expired。
      operationId: finishLocalTurn
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalTurnFinishRequest' }
            example:
              tool_grant: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              content: 总结这篇笔记
              reply: 这篇笔记主要讲了……
              steps: [{ kind: thinking, text: 先读取笔记内容 }]
      responses:
        '200':
          description: 更新后的会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /sandbox/local/runtime:
    post:
      tags: [Sessions]
      summary: 签发本地沙箱运行时授权
      description: 为已登录的桌面用户签发 12 小时有效的运行时授权，供本机 Broker 通过本 API 访问产品模型；产品模型密钥始终只保存在服务端。未配置产品模型返回 503 model_unconfigured。
      operationId: issueLocalRuntime
      responses:
        '200':
          description: 本地运行时授权
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalRuntimeResponse' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '503': { $ref: '#/components/responses/Error' }

  /sandbox/local/model/v1/chat/completions:
    post:
      tags: [Sessions]
      summary: 本地沙箱模型代理
      description: OpenAI 兼容的 Chat Completions 代理，仅供本地 Broker 使用运行时授权调用。请求中的 model 只能是产品模型之一，否则改用用户当前产品模型；请求体上限 4 MiB，响应（含 SSE 流）上限 8 MiB 并原样透传上游状态码。
      operationId: localSandboxChatCompletions
      security: [{ localRuntime: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JsonObject' }
            example: { model: product-model, stream: true, messages: [{ role: user, content: 你好 }] }
      responses:
        '200':
          description: 上游模型响应（JSON 或 text/event-stream）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonObject' }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /agent/sandbox-model/chat/completions:
    post:
      tags: [Sessions]
      summary: 沙箱回合使用用户自己的模型
      description: 用户配置了自定义 OpenAI 兼容模型时，云端沙箱的 Broker 用本轮的工具授权调用此接口，API 通过防 SSRF 的客户端转发到用户上游并流式返回。用户的 API Key 不离开 API。请求体上限 4 MiB、响应上限 8 MiB；不计入产品额度。未配置自定义模型返回 409 custom_model_unavailable。
      operationId: sandboxCustomModel
      security: []
      parameters:
        - { $ref: '#/components/parameters/ToolGrant' }
        - { $ref: '#/components/parameters/ToolOwner' }
        - { $ref: '#/components/parameters/ToolSession' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JsonObject' }
      responses:
        '200':
          description: 用户上游的响应（JSON 或 text/event-stream）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonObject' }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /agent/sandbox-tools:
    get:
      tags: [Sessions]
      summary: 列出沙箱回合可调用的工具
      description: 沙箱 Broker 在回合进行中使用工具授权、所有者与会话三个请求头调用；授权过期或不匹配返回 401 tool_grant_invalid。
      operationId: listSandboxTools
      security: []
      parameters:
        - { $ref: '#/components/parameters/ToolGrant' }
        - { $ref: '#/components/parameters/ToolOwner' }
        - { $ref: '#/components/parameters/ToolSession' }
      responses:
        '200':
          description: OpenAI function 工具定义
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxToolListResponse' }
        '401': { $ref: '#/components/responses/Error' }

  /agent/sandbox-tools/call:
    post:
      tags: [Sessions]
      summary: 在沙箱回合中调用一个工具
      description: 工具以该回合用户自己的认证请求执行，而非 Broker 身份。每个回合最多 60 次调用，请求体上限 64 KiB；未知工具返回 404 unknown_tool。
      operationId: callSandboxTool
      security: []
      parameters:
        - { $ref: '#/components/parameters/ToolGrant' }
        - { $ref: '#/components/parameters/ToolOwner' }
        - { $ref: '#/components/parameters/ToolSession' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxToolCallRequest' }
            example: { name: read_note, arguments: { id: 0123456789abcdef0123456789abcdef } }
      responses:
        '200':
          description: 工具执行结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxToolCallResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/sandbox-tools/stream:
    post:
      tags: [Sessions]
      summary: 接收沙箱回合中模型正在产生的思考与正文
      description: 由沙箱 Broker 以该回合的工具授权调用。`call` 为该回合内模型调用的序号：更大的序号重置内容，更小的被丢弃。请求体上限 64 KiB；每次调用的思考与正文各保留至多 64 KiB。
      operationId: streamSandboxTurn
      security: []
      parameters:
        - { $ref: '#/components/parameters/ToolGrant' }
        - { $ref: '#/components/parameters/ToolOwner' }
        - { $ref: '#/components/parameters/ToolSession' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [call]
              properties:
                call: { type: integer, minimum: 1 }
                seq: { type: integer, minimum: 0 }
                events:
                  type: array
                  items:
                    type: object
                    required: [kind, text]
                    properties:
                      kind: { type: string, enum: [thinking, text] }
                      text: { type: string }
      responses:
        '204': { description: 已记录 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
