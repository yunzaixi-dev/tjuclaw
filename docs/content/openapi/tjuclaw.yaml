        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        name: { type: string }
        created_at: { type: string, format: date-time }
        withdrawn: { type: boolean }
    PublicationResponse:
      type: object
      required: [publication]
      properties:
        publication: { $ref: '#/components/schemas/Publication' }
    PublicationListResponse:
      type: object
      required: [publications]
      properties:
        publications:
          type: array
          items: { $ref: '#/components/schemas/Publication' }
    SearchHit:
      type: object
      required: [id, title, snippet, source]
      properties:
        id: { type: string }
        title: { type: string }
        snippet: { type: string }
        source: { type: string }
    SearchResponse:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
    Message:
      type: object
      required: [role, content, created_at]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        client_request_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
